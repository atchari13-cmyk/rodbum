<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>ลอยกระทง LIVE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0a0620;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,56.25vh);height:min(177.78vw,100vh)}

#start button{font:bold 22px Tahoma,sans-serif;padding:16px 30px;border-radius:30px;border:0;background:#ffd23f;color:#2a0f4d}
</style></head><body>
<canvas id="c" width="540" height="960"></canvas>
<div id="start"><button onclick="startAudio()">🔊 แตะเพื่อเริ่มเกม (เปิดเสียง)</button></div>
<div id="demo">
 <button onclick="demo('member')">🪷 เข้าร่วม</button>
 <button onclick="demo('like')">❤️ ไลก์</button>
 <button onclick="demo('chat')">💬 คอมเมนต์</button>
 <button onclick="demo('pray')">🙏 ขอพร</button>
 <button onclick="demo('gift')">🎁 ของขวัญเล็ก</button>
 <button onclick="demo('gift',500)">🎁 ของขวัญใหญ่</button>
 <button onclick="demo('follow')">➕ ตามแล้ว</button>
 <button onclick="demo('share')">🔁 แชร์</button>
 <button onclick="for(let i=0;i<10;i++)demo('member')">+10 คน</button>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=540,H=960,GY=346,MAX=26;
const q=new URLSearchParams(location.search);
// เนื้อหาสำคัญทั้งหมดอยู่เหนือเส้น LIM เพื่อไม่ให้ช่องคอมเมนต์ของ TikTok ทับ (ปรับได้ ?lim=520)
const LIM=Math.max(480,Math.min(700,+(q.get('lim')||575)));
const FONT='Tahoma,"Noto Sans Thai",sans-serif';
// ตั้งค่าผ่านลิงก์: ?tts=all|prayer|off  ?sfx=0  ?vol=0.5  ?music=0  ?ban=คำ,คำ  ?lim=575
const P={tts:q.get('tts')||'all',sfx:q.get('sfx')!=='0',vol:Math.min(1,+(q.get('vol')||.8)),music:q.get('music')==='0'?0:Math.min(1,+(q.get('music')||.6))};
const isDemo=q.has('demo');if(isDemo)document.body.classList.add('demo');
const LT=GY+42,LB=LIM-30,LANE=[0,1,2,3].map(i=>LT+i*(LB-LT)/3);
const CL=['#ff7aa2','#ffd23f','#7ae7c7','#8ecbff','#c3a6ff','#ff9f5a','#f472b6','#9be564'];
let wsOk=false;const ppl=new Map();
let floats=[],parts=[],lants=[],banner=null,prayer=null,total=0,goal=100,status={ok:false};
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const rnd=(a,b)=>a+Math.random()*(b-a);

// ================= เสียง =================
let AC=null,master=null,mg=null,audioOn=false;
function startAudio(){
  document.getElementById('start').style.display='none';
  try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(_){}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=P.vol;master.connect(AC.destination);
    mg=AC.createGain();mg.gain.value=P.music*.5;mg.connect(master);
    if('speechSynthesis' in window)speechSynthesis.speak(new SpeechSynthesisUtterance(''));audioOn=true;sfx('chime');startMusic();setTimeout(()=>speak(INVITE[0],{rate:.92,pitch:1.05,long:1}),2500)}catch(e){}
}
function tone(f,t0,d,type,v,dest){
  const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime+t0;
  o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);
  gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(dest||master);o.start(t);o.stop(t+d+.05);
}
const SFX={
  plop(){tone(300,0,.12,'sine',.12);tone(520,.04,.14,'sine',.08)},
  coin(){tone(1320,0,.12,'square',.05);tone(1760,.08,.3,'square',.05)},
  bell(){[196,392,588,790].forEach((f,i)=>tone(f,0,2.4-i*.4,'sine',.22/(i+1)))},
  gold(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.45,'triangle',.1))},
  chime(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.13,1,'sine',.1))},
  boom(){tone(90,0,.5,'sawtooth',.12);tone(60,.05,.6,'sine',.2)},
  big(){SFX.bell();SFX.gold();setTimeout(SFX.boom,200);setTimeout(SFX.coin,350)}
};
const sfxT={};
function sfx(n){if(!AC||!P.sfx)return;const t=performance.now();if(t-(sfxT[n]||0)<120)return;sfxT[n]=t;try{SFX[n]()}catch(e){}}
// เพลงบรรยากาศสังเคราะห์ (ไม่มีลิขสิทธิ์) ปิดได้ด้วย ?music=0
const PENT=[262,294,330,392,440,524,588,660,784,880];
function startMusic(){
  if(!AC||!P.music)return;let i=3;
  setInterval(()=>{if(Math.random()<.3)return;i=Math.max(0,Math.min(PENT.length-1,i+Math.floor(rnd(-2,3))));
    tone(PENT[i],0,1.5,'triangle',.12,mg);if(Math.random()<.25)tone(PENT[i]*2,.02,.9,'sine',.05,mg)},650);
  const drone=()=>{tone(131,0,8,'sine',.1,mg);tone(196,0,8,'sine',.05,mg)};drone();setInterval(drone,7500);
}

// ================= อ่านออกเสียงไทย =================
let lastSpoke=performance.now();let voices=[];const tts={q:[],busy:false,id:0};
if('speechSynthesis' in window){const lv=()=>voices=speechSynthesis.getVoices();lv();speechSynthesis.onvoiceschanged=lv}
function clean(s,m){
  return String(s).replace(/https?:\/\/\S+/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'')
    .replace(/5{3,}/g,'ฮ่าๆๆ').replace(/(.)\1{3,}/gu,'$1$1').trim().slice(0,m||90);
}
function speak(text,o){
  o=o||{};if(!audioOn||P.tts==='off'||!('speechSynthesis' in window))return;
  text=clean(text,o.long?240:90);if(!text)return;
  if(o.pri){tts.q=tts.q.filter(x=>x.pri);tts.q.push({t:text,pri:1,rate:o.rate,pitch:o.pitch})}
  else{if(tts.q.length>=2)return;tts.q.push({t:text,rate:o.rate,pitch:o.pitch})}
  nextSpeak();
}
function nextSpeak(){
  if(tts.busy||!tts.q.length)return;
  const it=tts.q.shift(),u=new SpeechSynthesisUtterance(it.t),id=++tts.id;
  u.lang='th-TH';const v=voices.find(v=>/^th/i.test(v.lang));if(v)u.voice=v;
  u.rate=it.rate||1;u.pitch=it.pitch||1;u.volume=Math.min(1,P.vol+.2);
  tts.busy=true;lastSpoke=performance.now();const done=()=>{if(tts.id===id){tts.busy=false;lastSpoke=performance.now();nextSpeak()}};
  u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  setTimeout(()=>{if(tts.busy&&tts.id===id){speechSynthesis.cancel();done()}},15000);
}


// ================= คำเชิญพูดเป็นระยะๆ ตอนเงียบ =================
// ปรับความถี่ด้วย ?talk=วินาที (ค่าเริ่มต้น 40, ขั้นต่ำ 15)  ปิดด้วย ?talk=0
const TALK=q.get('talk')==='0'?0:Math.max(15,+(q.get('talk')||40));
const INVITE=[
 'ขอเชิญทุกท่านร่วมลอยกระทง ขอบคุณสายน้ำที่หล่อเลี้ยงชีวิตเรา และอย่าลืมอธิษฐานก่อนปล่อยกระทงลอยไปนะคะ',
 'พิมพ์คำว่า ขอให้ แล้วตามด้วยพรที่คุณปรารถนา กระทงของคุณจะลอยไปพร้อมคำอธิษฐานค่ะ',
 'แสงเทียนนวลตา กลีบบัวพลิ้วไหว ขอให้ทุกความตั้งใจดี ลอยไปถึงฝั่งฝันนะคะ',
 'คืนนี้พระจันทร์เต็มดวง เชิญทุกท่านหลับตาลงสักครู่ ตั้งจิตอธิษฐาน แล้วปล่อยความทุกข์ให้ลอยไปกับสายน้ำค่ะ',
 'กดไลก์เพื่อช่วยให้กระทงของคุณลอยไปไกลๆ ถึงฝั่งฝัน นะคะ',
 'ขอให้ทุกท่านมีสุขภาพแข็งแรง ครอบครัวอบอุ่น และสมหวังในสิ่งที่ปรารถนาค่ะ',
 'ใครเพิ่งเข้ามา ยินดีต้อนรับสู่งานลอยกระทงออนไลน์นะคะ พิมพ์ ขอให้ ตามด้วยคำอธิษฐาน แล้วร่วมลอยกระทงด้วยกันเลยค่ะ',
 'ลอยกระทงคืนนี้ ขอลอยความโกรธ ความทุกข์ และความเศร้าหมอง ให้ไหลไปตามน้ำ เหลือไว้เพียงรอยยิ้มและความสุขค่ะ',
 'เมื่อกระทงลอยไป ขอให้คำอธิษฐานของคุณลอยไปถึงดวงจันทร์ที่ส่องแสงอยู่เหนือสายน้ำค่ะ',
 'ถ้าชอบบรรยากาศงานลอยกระทงคืนนี้ ฝากกดติดตาม และชวนเพื่อนๆ มาร่วมอธิษฐานด้วยกันนะคะ',
 'ขอบคุณทุกท่านที่มาร่วมลอยกระทงด้วยกันนะคะ ขอให้ทุกคนมีแต่ความสุข ความสงบ และโชคดีตลอดไปค่ะ'
];
let invOrder=[],invN=0;
function nextInvite(){
  const live=[...ppl.values()].filter(o=>o.k).length;
  invN++;
  if(invN%4===0&&live>0)return 'ตอนนี้มีกระทงลอยอยู่ในสายน้ำ '+live+' ใบ บุญรวม '+total+' ขออนุโมทนากับทุกท่านค่ะ';
  if(!invOrder.length)invOrder=INVITE.map((_,i)=>i).sort(()=>Math.random()-.5);
  return INVITE[invOrder.pop()];
}
setInterval(()=>{
  if(!TALK||!audioOn||P.tts==='off'||tts.busy||tts.q.length)return;
  if(performance.now()-lastSpoke<TALK*1000)return;
  speak(nextInvite(),{rate:.92,pitch:1.05,long:1});
},4000);

// ================= ตัวกรองคำไม่เหมาะสม =================
const norm=s=>String(s).toLowerCase().replace(/[\s.\-_*~'"`|,/\\+=()\[\]{}<>:;\u00b7\u2022\u200b-\u200d\ufeff]/g,'').replace(/(.)\1{2,}/gu,'$1');
const noTone=s=>s.replace(/[\u0E48-\u0E4B]/g,'');
const TH_BAD=['เหีย','สัส','ควย','เย็ด','เชีย','เงียน','ตอแหล','ระยำ','เสือก','กระหรี','ดอกทอง','สนตีน','แตด','ชักวาว','ไอสัตว์','อีสัตว์','ไปตาย','ชาติหมา','ขายตัว'];
const EXTRA=(q.get('ban')||'').split(',').map(w=>noTone(norm(w))).filter(Boolean);
const EN_BAD=/fuck|shit|bitch|asshole|nigg(a|er)|whore|slut|pussy|porn|faggot/;
function isBad(s){
  s=String(s||'');const n=norm(s),th=noTone(n);
  if(/https?:|www\.|\.com|line\.me|@\w{3,}|\d{9,}/i.test(s))return true;
  if(TH_BAD.some(w=>th.includes(w))||EXTRA.some(w=>th.includes(w)))return true;
  if(/หี(?!บ)/.test(th)||/แม่ง|ห่า(?![งน])/.test(n))return true;
  const en=n.replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/@/g,'a').replace(/\$/g,'s');
  return EN_BAD.test(en)||/\b(dick|rape|raped|rapist|cunt)\b/.test(s.toLowerCase());
}

// ================= ตรรกะเกม =================
function burst(x,y,c,n,sp,gv){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7+Math.random()*.6,c,g:gv||0})}}
function firework(x,y,c,n){n=n||34;for(let i=0;i<n;i++){const a=i/n*6.283,s=rnd(110,150);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1.3,c,g:50,add:1})}}
function skyLantern(x,y){lants.push({x:x||rnd(40,500),y:y||rnd(LIM-40,LIM+60),sd:rnd(0,6),age:0,sp:rnd(22,34)})}
function getP(id,name,avatar){
  let p=ppl.get(id);
  if(!p){
    if(ppl.size>300){for(const x of ppl.values())if(!x.k){ppl.delete(x.id);break}}
    const h=hash(id);
    p={id,name:(isBad(name||id)?'ผู้ใจบุญ':(name||id)).slice(0,12),color:CL[h%CL.length],score:0,k:false,x:0,lane:0,sc:0,seed:rnd(0,6.28),
       spd:12,boost:0,gold:0,glow:0,card:'',cardT:0,cardPray:false,img:null,last:0,done:0};
    if(avatar){const im=new Image();im.onload=()=>p.img=im;im.src=avatar}
    ppl.set(id,p);
  }
  p.last=performance.now();return p;
}
function launch(p){
  if(p.k)return;
  let cnt=[0,0,0,0];for(const o of ppl.values())if(o.k&&o.x<160)cnt[o.lane]++;
  p.lane=cnt.indexOf(Math.min(...cnt));p.k=true;p.x=rnd(-10,90);p.sc=0;p.spd=rnd(11,16);p.boost=0;sfx('plop');
  let live=[...ppl.values()].filter(o=>o.k);
  if(live.length>MAX){live.sort((a,b)=>a.last-b.last);live[0].k=false}
}
function addScore(p,n){p.score+=n;total+=n;if(total>=goal){while(total>=goal)goal+=100;celebrate()}}
function celebrate(){
  sfx('big');banner={t1:'🪷 บุญครบ '+(goal-100)+'!',t2:'ปล่อยโคมลอยเต็มท้องฟ้า',life:5,tier:3};
  for(let i=0;i<16;i++)setTimeout(()=>skyLantern(),i*160);
  for(let i=0;i<6;i++)setTimeout(()=>{firework(rnd(80,460),rnd(190,320),CL[i%CL.length],38);sfx('boom')},i*380);
  speak('ขออนุโมทนาบุญกับทุกท่านค่ะ ปล่อยโคมลอยเต็มท้องฟ้าแล้ว',{pri:1,rate:.95});
}
const PRAY=/^\s*(🙏|#พร|อธิษฐาน|สาธุ|ขอพร|ขอให้|ขอ(?!บ|โทษ|ถาม|เลข|หวย))/;
function handle(m){
  if(m.type==='status'){status=m;return}
  const p=getP(m.id,m.name,m.avatar);
  if(m.type==='chat'){
    const t=(m.text||'').trim();if(!t||isBad(t))return;
    launch(p);
    if(PRAY.test(t)){
      const w=t.replace(/^\s*#พร\s*/,'').slice(0,60);
      p.card=w;p.cardT=7;p.cardPray=true;p.glow=3;addScore(p,3);sfx('chime');
      prayer={name:p.name,text:w,life:16};
      for(let i=0;i<3;i++)setTimeout(()=>firework(rnd(120,420),rnd(190,300),'#ffd27a',18),i*250);
      speak(p.name+' ขอพรว่า '+w,{pri:1,rate:.9,pitch:1.05});
    }else{
      p.card=t.slice(0,22);p.cardT=3.5;p.cardPray=false;addScore(p,1);
      if(P.tts==='all')speak('คุณ'+p.name+' บอกว่า '+t);
    }
  }
  else if(m.type==='member'){launch(p)}
  else if(m.type==='like'){const n=Math.min(m.n||1,20);launch(p);p.boost=Math.min(150,p.boost+22+n*3);addScore(p,n);
    floats.push({x:p.x,y:LANE[p.lane]-34,t:'+'+n,s:17,c:'#ffe27a',l:1.2})}
  else if(m.type==='gift'){
    const d=Math.max(1,m.diamonds||1),tier=d>=300?3:d>=30?2:1;
    launch(p);p.gold=tier===3?60:tier===2?40:25;p.sc=1;addScore(p,Math.max(10,d));
    banner={t1:'🎁 '+p.name+' ส่ง '+m.gift+(m.n>1?' ×'+m.n:''),t2:tier===3?'กระทงมหาบุญลอยแล้ว!':'กระทงทองลอยแล้ว!',life:4.5,tier};
    sfx(tier>1?'big':'gold');
    const nf=tier===3?8:tier===2?5:2;
    for(let i=0;i<nf;i++)setTimeout(()=>{firework(rnd(70,470),rnd(185,320),CL[i%CL.length],36);sfx('boom')},i*300);
    for(let i=0;i<(tier===3?14:tier===2?6:0);i++)setTimeout(()=>skyLantern(),i*180);
    speak(tier===3?'ขออนุโมทนาบุญกับคุณ'+p.name+' กระทงมหาบุญลอยแล้วค่ะ':'ขอบคุณคุณ'+p.name+' ที่ร่วมลอยกระทงทองค่ะ',{pri:1});
  }
  else if(m.type==='follow'){launch(p);addScore(p,3);p.glow=4;floats.push({x:p.x,y:LANE[p.lane]-34,t:'🕯️ ผู้ร่วมลอย',s:16,c:'#ffd9a0',l:1.8})}
  else if(m.type==='share'){launch(p);addScore(p,3);skyLantern(p.x>0?p.x:rnd(60,480),LIM);floats.push({x:p.x,y:LANE[p.lane]-34,t:'🏮 แบ่งบุญ',s:16,c:'#ffd9a0',l:1.8})}
}

// ================= เชื่อมกับตัวรับข้อมูลจาก TikTok =================
function connectWS(){
  const host=location.host||'localhost:3000';
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+host);
  const user=q.get('user');
  ws.onopen=()=>{wsOk=true;if(user)ws.send(JSON.stringify({type:'setUser',user}))};
  ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(_){}};
  ws.onclose=()=>{wsOk=false;status={ok:false};setTimeout(connectWS,2000)};
}
connectWS();

// ---- ปุ่มจำลอง (เปิดด้วย /?demo) ----
const NAMES=['น้องเอ','พี่บอล','มะลิ','ต้นกล้า','แมวส้ม','ลุงหมึก','ฟ้าใส','ปังปอนด์','เจ๊นุ้ย','บีม','ก้อย','โอม'];
const WISH=['ขอให้สุขภาพแข็งแรง','ขอให้ถูกหวยรางวัลที่หนึ่ง','ขอให้ครอบครัวมีความสุข','อธิษฐานให้สอบผ่านนะ','ขอให้งานราบรื่นทุกอย่าง'];
function demo(type,dia){
  const nm=NAMES[Math.floor(Math.random()*NAMES.length)],id=type==='member'?nm+Math.floor(Math.random()*999):nm;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  if(type==='pray')return handle({type:'chat',id,name:nm,text:pick(WISH)});
  handle({type,id,name:nm,text:pick(['สู้ๆ','สวยมากเลย','555','สวัสดีทุกคน']),n:5,gift:dia?'Universe':'Rose',diamonds:dia||1});
}

// ================= อัปเดต =================
function update(dt){
  for(const p of ppl.values()){
    p.glow-=dt;p.cardT-=dt;p.gold-=dt;
    if(!p.k)continue;
    p.sc=Math.min(1,p.sc+dt*1.5);p.boost*=Math.exp(-.5*dt);p.x+=(p.spd+p.boost)*dt;
    if(p.boost>40&&Math.random()<.5)parts.push({x:p.x-20,y:LANE[p.lane]+8,vx:rnd(-15,0),vy:rnd(-20,-5),l:.6,c:'#ffe9a8',g:0,add:1});
    if(p.x>W+50){p.k=false;p.done++}
  }
  for(const l of lants){l.age+=dt;l.y-=l.sp*dt;l.x+=Math.sin(l.age*1.1+l.sd)*14*dt}
  lants=lants.filter(l=>l.y>150);
  for(const f of floats){f.l-=dt;f.y-=24*dt}floats=floats.filter(f=>f.l>0);
  parts=parts.filter(p=>(p.l-=dt)>0);for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985}
  if(banner&&(banner.life-=dt)<=0)banner=null;
  if(prayer&&(prayer.life-=dt)<=0)prayer=null;
}

  // แม่น้ำ

  x.fillStyle=gr;x.fillRect(0,GY,W,H-GY);

// ================= วาด =================
function txt(s,x,y,size,color,align,stroke){
  g.font='bold '+size+'px '+FONT;g.textAlign=align||'center';g.textBaseline='middle';
  if(stroke!==false){g.lineWidth=4;g.strokeStyle='rgba(15,5,35,.9)';g.strokeText(s,x,y)}
  g.fillStyle=color;g.fillText(s,x,y);
}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function ell(x,y,rx,ry,c){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,0,0,6.28);g.fill()}
function wrap(s,maxW,size,maxL){
  g.font='bold '+size+'px '+FONT;const L=[];let cur='';
  for(const ch of s){if(g.measureText(cur+ch).width>maxW){L.push(cur);cur=ch;if(L.length>=maxL)break}else cur+=ch}
  if(L.length<maxL&&cur)L.push(cur);
  if([...L.join('')].length<[...s].length)L[L.length-1]=L[L.length-1].slice(0,-1)+'…';
  return L;
}
function water(t){
  g.save();g.beginPath();g.rect(0,GY,W,H-GY);g.clip();
  for(let i=0;i<24;i++){const y=GY+8+i*15,w=34-i*.9+Math.sin(t*2+i)*9,a=Math.max(0,.4-i*.017);
    g.fillStyle='rgba(255,236,180,'+a+')';g.fillRect(440-w/2+Math.sin(t*1.5+i)*7,y,w,3)}
  g.fillStyle='rgba(255,255,255,.07)';
  for(let i=0;i<30;i++){const y=GY+16+(i*41)%(H-GY-30),x=((i*97)+t*(6+(i%3)*5))%(W+90)-45;g.fillRect(x,y,36+(i%4)*14,2)}
  g.restore();
}
function drawK(p,t){
  const s=(.74+p.lane*.1)*(p.gold>0?1.35:1)*(.25+.75*p.sc),x=p.x,y=LANE[p.lane]+Math.sin(t*1.4+p.seed)*2.5;
  const gold=p.gold>0,col=gold?'#ffd23f':p.color;
  g.globalAlpha=.28;ell(x,y+24*s,28*s,8*s,'#ffb347');g.globalAlpha=1;
  if(gold||p.glow>0){const hg=g.createRadialGradient(x,y-8*s,4,x,y-8*s,58*s);hg.addColorStop(0,gold?'rgba(255,215,80,.55)':'rgba(255,200,120,.4)');hg.addColorStop(1,'rgba(255,200,80,0)');g.fillStyle=hg;g.fillRect(x-60*s,y-70*s,120*s,120*s)}
  ell(x,y+9*s,29*s,10*s,'#2f7d3c');ell(x,y+6*s,26*s,8.5*s,'#4aa857');
  const petal=(a)=>{const px=x+Math.cos(a)*18*s,py=y+3*s+Math.sin(a)*5*s;g.fillStyle=col;g.beginPath();g.ellipse(px,py-7*s,5.4*s,10*s,Math.cos(a)*.5,0,6.28);g.fill();g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1;g.stroke()};
  const n=8,off=p.seed*.2;
  for(let i=0;i<n;i++){const a=i/n*6.283+off;if(Math.sin(a)<0)petal(a)}
  g.fillStyle='#fff3c4';g.fillRect(x-2.2*s,y-16*s,4.4*s,15*s);
  g.strokeStyle='#8b2f2f';g.lineWidth=1.6*s;g.beginPath();g.moveTo(x+9*s,y+2*s);g.lineTo(x+11*s,y-24*s);g.stroke();g.fillStyle='#ff5a3c';g.fillRect(x+10*s,y-26*s,2.2*s,3*s);
  const fl=1+Math.sin(t*9+p.seed)*.15;g.shadowColor='#ffb347';g.shadowBlur=16;ell(x,y-21*s,3.2*s,6*s*fl,'#ffcf6b');g.shadowBlur=0;ell(x,y-20*s,1.6*s,3.4*s*fl,'#fff7d6');
  for(let i=0;i<n;i++){const a=i/n*6.283+off;if(Math.sin(a)>=0)petal(a)}
  if(p.img){g.save();g.beginPath();g.arc(x,y+8*s,7.5*s,0,6.28);g.clip();try{g.drawImage(p.img,x-7.5*s,y+.5*s,15*s,15*s)}catch(e){}g.restore();g.strokeStyle='#fff';g.lineWidth=1.4;g.beginPath();g.arc(x,y+8*s,7.5*s,0,6.28);g.stroke()}
  txt(p.name,x,y+28*s,15,'#fff');
  if(p.cardT>0&&p.card){
    g.font='bold 15px '+FONT;const w=g.measureText(p.card).width+22,cy=y-44*s;
    const cx=Math.max(w/2+6,Math.min(W-w/2-6,x));g.globalAlpha=Math.min(1,p.cardT);g.fillStyle=p.cardPray?'#ffe9a8':'#fff';rr(cx-w/2,cy-14,w,28,14);g.fill();
    txt((p.cardPray?'🏮 ':'')+p.card,cx,cy,15,'#3a1450','center',false);g.globalAlpha=1;
  }
}
function draw(){

  rr(24,150,W-48,88,16);g.fillStyle='rgba(10,4,30,.55)';g.fill();g.strokeStyle='rgba(255,210,122,.8)';g.lineWidth=2;g.stroke();
  if(prayer){
    txt('🏮 คำอธิษฐานจาก '+prayer.name,W/2,172,17,'#ffd27a');
    const L=wrap(prayer.text,W-80,21,2);L.forEach((l,i)=>txt(l,W/2,200+i*26-(L.length===1?8:0)+(L.length===1?12:0),21,'#fff'));
  }else{
    txt('พิมพ์ "ขอให้…" ในคอมเมนต์',W/2,184,21,'#fff');txt('แล้วกระทงพร้อมคำอธิษฐานของคุณจะลอยไป',W/2,214,17,'#cbb6f5',null,false);

  if(!top.length)txt('🏵 เจ้าภาพกระทง  รอผู้ร่วมบุญ',40,262,16,'#ffd27a','left');
  else{txt('🏵',40,262,16,'#ffd27a','left');top.forEach((c,i)=>txt((i+1)+'.'+c.name.slice(0,5)+' '+c.score,68+i*98,262,14,i?'#fff':'#ffd27a','left'))}
  // กระทง เรียงตามช่องน้ำ
  const arr=[...ppl.values()].filter(o=>o.k).sort((a,b)=>a.lane-b.lane||a.x-b.x);

  // โคมลอย

  }
  // ดอกไม้ไฟและประกาย
  for(const p of parts){g.globalAlpha=Math.max(0,Math.min(1,p.l));g.globalCompositeOperation=p.add?'lighter':'source-over';g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,p.add?3:4,p.add?3:4)}
  g.globalAlpha=1;g.globalCompositeOperation='source-over';

  if(banner){

    txt(!wsOk?'ต่อเซิร์ฟเวอร์ไม่ได้':status.ok?'เชื่อมแล้ว @'+who:'ต่อ TikTok ยังไม่ติด @'+who,W-32,20,12,'#fff','right');
    if(wsOk&&!status.ok&&status.err){const e=String(status.err);txt(e.slice(0,42),W-32,36,11,'#ffb3b3','right');if(e.length>42)txt(e.slice(42,84),W-32,50,11,'#ffb3b3','right')}
  }
}
