// ================= เสียง =================
let AC=null,master=null,mg=null,audioOn=false;
function startAudio(){
  document.getElementById('start').style.display='none';
  try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(_){}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=P.vol;master.connect(AC.destination);
    mg=AC.createGain();mg.gain.value=P.music*.5;mg.connect(master);
    if('speechSynthesis' in window)speechSynthesis.speak(new SpeechSynthesisUtterance(''));audioOn=true;sfx('chime');startMusic();setTimeout(()=>speak(INVITE[0],{rate:.92,pitch:1.05,long:1}),2500)}catch(e){}
}
function tone(f,t0,d,type,v,dest){
  const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime+t0;
  o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);
  gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(dest||master);o.start(t);o.stop(t+d+.05);
}
const SFX={
  plop(){tone(300,0,.12,'sine',.12);tone(520,.04,.14,'sine',.08)},
  coin(){tone(1320,0,.12,'square',.05);tone(1760,.08,.3,'square',.05)},
  bell(){[196,392,588,790].forEach((f,i)=>tone(f,0,2.4-i*.4,'sine',.22/(i+1)))},
  gold(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.45,'triangle',.1))},
  chime(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.13,1,'sine',.1))},
  boom(){tone(90,0,.5,'sawtooth',.12);tone(60,.05,.6,'sine',.2)},
  rattle(){for(let i=0;i<9;i++)tone(700+Math.random()*800,i*.07,.05,'square',.04)},
  stick(){tone(1900,0,.25,'triangle',.08);tone(2500,.05,.2,'triangle',.05)},
  big(){SFX.bell();SFX.gold();setTimeout(SFX.boom,200);setTimeout(SFX.coin,350)}
};
const sfxT={};
function sfx(n){if(!AC||!P.sfx)return;const t=performance.now();if(t-(sfxT[n]||0)<120)return;sfxT[n]=t;try{SFX[n]()}catch(e){}}
// เพลงบรรยากาศสังเคราะห์ (ไม่มีลิขสิทธิ์) ปิดได้ด้วย ?music=0
const PENT=[262,294,330,392,440,524,588,660,784,880];
function startMusic(){
  if(!AC||!P.music)return;let i=3;
  setInterval(()=>{if(Math.random()<.3)return;i=Math.max(0,Math.min(PENT.length-1,i+Math.floor(rnd(-2,3))));
    tone(PENT[i],0,1.5,'triangle',.12,mg);if(Math.random()<.25)tone(PENT[i]*2,.02,.9,'sine',.05,mg)},650);
  const drone=()=>{tone(131,0,8,'sine',.1,mg);tone(196,0,8,'sine',.05,mg)};drone();setInterval(drone,7500);
}

// ================= อ่านออกเสียงไทย =================
let lastSpoke=performance.now();let voices=[];const tts={q:[],busy:false,id:0};
if('speechSynthesis' in window){const lv=()=>voices=speechSynthesis.getVoices();lv();speechSynthesis.onvoiceschanged=lv}
function clean(s,m){
  return String(s).replace(/https?:\/\/\S+/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'')
    .replace(/5{3,}/g,'ฮ่าๆๆ').replace(/(.)\1{3,}/gu,'$1$1').trim().slice(0,m||90);
}
function speak(text,o){
  o=o||{};if(!audioOn||P.tts==='off'||!('speechSynthesis' in window))return;
  text=clean(text,o.long?240:90);if(!text)return;
  if(o.pri){tts.q=tts.q.filter(x=>x.pri);tts.q.push({t:text,pri:1,rate:o.rate,pitch:o.pitch})}
  else{if(tts.q.length>=2)return;tts.q.push({t:text,rate:o.rate,pitch:o.pitch})}
  nextSpeak();
}
function nextSpeak(){
  if(tts.busy||!tts.q.length)return;
  const it=tts.q.shift(),u=new SpeechSynthesisUtterance(it.t),id=++tts.id;
  u.lang='th-TH';const v=voices.find(v=>/^th/i.test(v.lang));if(v)u.voice=v;
  u.rate=it.rate||1;u.pitch=it.pitch||1;u.volume=Math.min(1,P.vol+.2);
  tts.busy=true;lastSpoke=performance.now();const done=()=>{if(tts.id===id){tts.busy=false;lastSpoke=performance.now();nextSpeak()}};
  u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  setTimeout(()=>{if(tts.busy&&tts.id===id){speechSynthesis.cancel();done()}},15000);
}


// ================= คำเชิญพูดเป็นระยะๆ ตอนเงียบ =================

 'ขอบคุณทุกท่านที่มาร่วมลอยกระทงด้วยกันนะคะ ขอให้ทุกคนมีแต่ความสุข ความสงบ และโชคดีตลอดไปค่ะ'

let invOrder=[],invN=0;
function nextInvite(){
  const live=krs.length;
  invN++;
  if(invN%4===0&&live>0)return 'ตอนนี้มีกระทงลอยอยู่ในสายน้ำ '+live+' ใบ บุญรวม '+total+' ขออนุโมทนากับทุกท่านค่ะ';
  if(!invOrder.length)invOrder=INVITE.map((_,i)=>i).sort(()=>Math.random()-.5);
  return INVITE[invOrder.pop()];
}
setInterval(()=>{
  if(!TALK||!audioOn||P.tts==='off'||tts.busy||tts.q.length)return;
  if(performance.now()-lastSpoke<TALK*1000)return;
  speak(nextInvite(),{rate:.92,pitch:1.05,long:1});
},4000);

// ================= ตัวกรองคำไม่เหมาะสม =================
const norm=s=>String(s).toLowerCase().replace(/[\s.\-_*~'"`|,/\\+=()\[\]{}<>:;\u00b7\u2022\u200b-\u200d\ufeff]/g,'').replace(/(.)\1{2,}/gu,'$1');
const noTone=s=>s.replace(/[\u0E48-\u0E4B]/g,'');
const TH_BAD=['เหีย','สัส','ควย','เย็ด','เชีย','เงียน','ตอแหล','ระยำ','เสือก','กระหรี','ดอกทอง','สนตีน','แตด','ชักวาว','ไอสัตว์','อีสัตว์','ไปตาย','ชาติหมา','ขายตัว'];
const EXTRA=(q.get('ban')||'').split(',').map(w=>noTone(norm(w))).filter(Boolean);
const EN_BAD=/fuck|shit|bitch|asshole|nigg(a|er)|whore|slut|pussy|porn|faggot/;
function isBad(s){
  s=String(s||'');const n=norm(s),th=noTone(n);
  if(/https?:|www\.|\.com|line\.me|@\w{3,}|\d{9,}/i.test(s))return true;
  if(TH_BAD.some(w=>th.includes(w))||EXTRA.some(w=>th.includes(w)))return true;
  if(/หี(?!บ)/.test(th)||/แม่ง|ห่า(?![งน])/.test(n))return true;
  const en=n.replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/@/g,'a').replace(/\$/g,'s');
  return EN_BAD.test(en)||/\b(dick|rape|raped|rapist|cunt)\b/.test(s.toLowerCase());
}

// ================= ตรรกะเกม =================
function burst(x,y,c,n,sp,gv){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7+Math.random()*.6,c,g:gv||0})}}
function firework(x,y,c,n){n=n||34;for(let i=0;i<n;i++){const a=i/n*6.283,s=rnd(80,115);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1.2,c,g:45,add:1})}}
const FW=()=>[rnd(70,470),rnd(262,340)];
function skyLantern(x,y){lants.push({x:x||rnd(30,510),y:y||rnd(400,470),sd:rnd(0,6),age:0,sp:rnd(20,30),big:Math.random()<.3})}
const activeCount=()=>{let n=0;for(const p of ppl.values())if(!p.leaving)n++;return n};
function leave(p){if(p.leaving)return;p.leaving=1;p.tasks=[];p.act=0;p.pose='';p.bubT=0;burst(p.x,p.y-25,'#cfe8ff',10,60)}
function getP(id,name,avatar){
  let p=ppl.get(id);
  if(!p){
    // จอเต็ม: ให้คนที่เงียบนานที่สุดเดินจากไปก่อน
    if(activeCount()>=MAXP){let v=null;for(const x of ppl.values())if(!x.leaving&&(!v||x.last<v.last))v=x;if(v)leave(v)}
    const h=hash(id);
    p={id,name:(isBad(name||id)?'ผู้ใจบุญ':(name||id)).slice(0,12),male:(h>>3)%3===0,sai:SAI[h%8],sin:SIN[(h>>4)%8],skin:SK[(h>>7)%4],
       x:rnd(40,500),y:rnd(CY0,CY1),tx:0,ty:0,wt:0,tasks:[],act:0,pend:0,score:0,glow:0,gold:0,bub:'',bubT:0,
       img:null,walk:0,mv:false,last:0,ns:Math.floor(Math.random()*4),dir:1,al:0,leaving:0};
    p.tx=rnd(40,500);p.ty=rnd(CY0,CY1);
    if(avatar){const im=new Image();im.onload=()=>p.img=im;im.src=avatar}
    ppl.set(id,p);
    // โผล่ทันทีพร้อมประกาย + ชื่อต้อนรับ
    burst(p.x,p.y-25,'#ffe9a8',12,70);floats.push({x:p.x,y:p.y-66,t:'🪷 '+p.name,s:14,c:'#ffd9a0',l:1.8});sfx('plop');
  }else if(p.leaving){p.leaving=0}
  p.last=performance.now();return p;
}
const task=(s,o)=>Object.assign({s,ox:rnd(-18,18),oy:rnd(-4,8)},o||{});
function addTask(p,t,front){if(front)p.tasks.unshift(t);else if(p.tasks.length<3)p.tasks.push(t)}
function addScore(p,n){p.score+=n;total+=n;const bd=board.get(p.id)||{name:p.name,score:0};bd.name=p.name;bd.score+=n;board.set(p.id,bd);
  if(board.size>300){let m=null;for(const e of board)if(!m||e[1].score<m[1].score)m=e;board.delete(m[0])}
  if(total>=goal){while(total>=goal)goal+=100;celebrate()}}
function celebrate(){
  sfx('big');banner={t1:'🪷 บุญครบ '+(goal-100)+'!',t2:'ปล่อยโคมลอยเต็มท้องฟ้า',life:5,tier:3};
  for(let i=0;i<16;i++)setTimeout(()=>skyLantern(),i*160);
  for(let i=0;i<6;i++)setTimeout(()=>{const f=FW();firework(f[0],f[1],SAI[i%8],38);sfx('boom')},i*380);
  speak('ขออนุโมทนาบุญกับทุกท่านค่ะ ปล่อยโคมลอยเต็มท้องฟ้าแล้ว',{pri:1,rate:.95});
}
function laneFree(){const c=[0,0,0];for(const k of krs)if(k.x<ST.pier.x+130)c[k.lane]++;return c.indexOf(Math.min(...c))}
function makeK(p,t){
  krs.push({owner:p.id,name:p.name,color:p.sai,x:ST.pier.x+52,lane:laneFree(),sc:0,spd:rnd(11,16),boost:0,gold:t.gold?40:0,seed:rnd(0,6.28),card:t.wish||'',cardT:t.wish?7:0,pray:!!t.wish});
  if(krs.length>MAXK)krs.shift();
}
function boostK(p,n){for(const k of krs)if(k.owner===p.id)k.boost=Math.min(150,k.boost+22+n*3)}

      p.fcd=performance.now()+60000;addTask(p,task('fortune'),true);return;

function connectWS(){
  const host=location.host||'localhost:3000';
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+host);
  const user=q.get('user');
  ws.onopen=()=>{wsOk=true;if(user)ws.send(JSON.stringify({type:'setUser',user}))};
  ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(err){errMsg=String((err&&err.message)||err);console.error('handle error',err)}};
  ws.onclose=()=>{wsOk=false;status={ok:false};setTimeout(connectWS,2000)};
}
connectWS();

// ================= อัปเดต =================
let presT=0;
function presence(dt){
  presT-=dt;if(presT>0)return;presT=1;
  const now=performance.now();
  // คนที่เงียบเกินเวลา = ออกจากไลฟ์ (TikTok ไม่ส่งสัญญาณ "ออก" ให้)
  for(const p of ppl.values())if(!p.leaving&&!p.tasks.length&&p.act<=0&&now-p.last>STAY*1000)leave(p);
  // ถ้ารู้จำนวนผู้ชมจริง ตัวละครต้องไม่เกินจำนวนนั้น: ให้คนที่เงียบนานสุดออกก่อน
  if(viewers>0){
    let n=activeCount();
    for(let i=0;i<3&&n>viewers;i++){
      let v=null;for(const p of ppl.values())if(!p.leaving&&!p.tasks.length&&p.act<=0&&now-p.last>15000&&(!v||p.last<v.last))v=p;
      if(!v)break;leave(v);n--;
    }
  }
}
function update(dt){
  presence(dt);
  for(const p of ppl.values()){
    if(p.leaving){p.al-=dt*1.6;if(p.al<=0)ppl.delete(p.id);continue}
    p.al=Math.min(1,p.al+dt*2.5);
    p.glow-=dt;p.bubT-=dt;p.gold-=dt;p.mv=false;
    if(p.act>0){p.act-=dt;if(p.act<=0)p.pose=''}
    else if(p.tasks.length){
      const t=p.tasks[0],S=ST[t.s];
      if(mv(p,S.x+t.ox,S.y+t.oy,90,dt)){p.act=t.s==='fortune'?2.4:1.8;p.pose=t.s;doAct(p,t);p.tasks.shift()}
    }else{
      p.wt-=dt;if(p.wt<=0){p.wt=rnd(2,6);p.tx=rnd(30,510);p.ty=rnd(CY0,CY1)}
      mv(p,p.tx,p.ty,30,dt);
    }
  }
  for(const k of krs){k.sc=Math.min(1,k.sc+dt*1.5);k.boost*=Math.exp(-.5*dt);k.x+=(k.spd+k.boost)*dt;k.cardT-=dt;k.gold-=dt;
    if(k.boost>40&&Math.random()<.5)parts.push({x:k.x-20,y:LANE[k.lane]+8,vx:rnd(-15,0),vy:rnd(-20,-5),l:.6,c:'#ffe9a8',g:0,add:1})}
  krs=krs.filter(k=>k.x<W+50);
  if(ST.fortune.sh>0)ST.fortune.sh-=dt;if(ST.bell.sw>0)ST.bell.sw-=dt;if(ST.pray.gl>0)ST.pray.gl-=dt;
  for(const l of lants){l.age+=dt;l.y-=l.sp*dt;l.x+=Math.sin(l.age*1.1+l.sd)*14*dt}
  lants=lants.filter(l=>l.y>200);
  for(const f of floats){f.l-=dt;f.y-=24*dt}floats=floats.filter(f=>f.l>0);
  parts=parts.filter(p=>(p.l-=dt)>0);for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985}
  if(banner&&(banner.life-=dt)<=0)banner=null;
  if(panel&&(panel.life-=dt)<=0)panel=null;
}
function mv(p,tx,ty,sp,dt){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d>3){p.x+=dx/d*sp*dt;p.y+=dy/d*sp*dt;p.walk+=dt*9;p.mv=true;if(Math.abs(dx)>1)p.dir=dx>0?1:-1;return false}return true}
function doAct(p,t){
  const S=ST[t.s],n=Math.max(1,p.pend);p.pend=0;
  floats.push({x:p.x,y:p.y-66,t:'+'+n+' บุญ',s:15,c:'#ffe27a',l:1.8});
  if(t.s==='pray'){ST.pray.gl=2.5;sfx('chime');floats.push({x:S.x,y:S.y-70,t:'🙏 สาธุ',s:20,c:'#fff',l:1.6})}
  else if(t.s==='bell'){ST.bell.sw=1.6;sfx('bell');burst(S.x,330,'#ffe9a8',14,120)}
  else if(t.s==='lantern'){skyLantern(S.x+rnd(-14,14),S.y-40);sfx('gold');floats.push({x:S.x,y:S.y-72,t:'🏮 ปล่อยโคม',s:16,c:'#ffd9a0',l:1.6})}
  else if(t.s==='fortune'){ST.fortune.sh=1.6;sfx('rattle');setTimeout(()=>{sfx('stick');fortune(p,t.vip)},1600)}
  else if(t.s==='pier'){makeK(p,t);sfx(t.gold?'big':'plop');burst(S.x+52,490,'#cfe8ff',10,90,120);
    if(t.gold){burst(S.x+52,480,'#ffd23f',30,200,60)}}
}

  g.globalAlpha=1;g.globalCompositeOperation='source-over';
  for(const f of floats){g.globalAlpha=Math.min(1,f.l);txt(f.t,f.x,f.y,f.s,f.c);g.globalAlpha=1}
  if(banner){
    const a=Math.min(1,banner.life,(4.5-banner.life)*4+.2);g.globalAlpha=Math.max(0,a);
    rr(40,262,W-80,76,20);g.fillStyle='rgba(30,10,50,.85)';g.fill();g.strokeStyle='#ffd23f';g.lineWidth=3;g.stroke();
    txt(banner.t1.slice(0,26),W/2,288,22,'#fff');txt(banner.t2,W/2,318,21,'#ffd23f');g.globalAlpha=1;
  }
  if(isDemo||q.has('debug')||performance.now()<20000){
    g.fillStyle=status.ok?'#3ddc97':'#ff4d6d';g.beginPath();g.arc(W-20,20,7,0,6.28);g.fill();
    const who=status.user||q.get('user')||'';
    txt(!wsOk?'ต่อเซิร์ฟเวอร์ไม่ได้':status.ok?'เชื่อมแล้ว @'+who:'ต่อ TikTok ยังไม่ติด @'+who,W-32,20,12,'#fff','right');
    const cs=Object.entries(status.cnt||{}).map(e=>e[0]+' '+e[1]).join(' · ')||'ยังไม่ได้รับเหตุการณ์จาก TikTok';
    txt('รับ: '+cs+' | ผู้ชม '+viewers+' | ตัวละคร '+activeCount(),8,490,12,'#ffe27a','left');
    if(errMsg)txt('ERR '+errMsg.slice(0,60),8,506,11,'#ff8a8a','left');
    if(wsOk&&!status.ok&&status.err){const e=String(status.err);txt(e.slice(0,42),W-32,36,11,'#ffb3b3','right');if(e.length>42)txt(e.slice(42,84),W-32,50,11,'#ffb3b3','right')}
  }
}
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{update(dt);draw()}catch(e){errMsg=String((e&&e.message)||e);console.error(e)}requestAnimationFrame(loop)})(last);
</script></body></html>
