// ================= เสียง =================
let AC=null,master=null,mg=null,audioOn=false;
function startAudio(){
  document.getElementById('start').style.display='none';
  try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(_){}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=P.vol;master.connect(AC.destination);
    mg=AC.createGain();mg.gain.value=P.music*.5;mg.connect(master);
    if('speechSynthesis' in window)speechSynthesis.speak(new SpeechSynthesisUtterance(''));audioOn=true;sfx('chime');startMusic();setTimeout(()=>speak(INVITE[0],{rate:.92,pitch:1.05,long:1}),2500)}catch(e){}
}
function tone(f,t0,d,type,v,dest){
  const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime+t0;
  o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);
  gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(dest||master);o.start(t);o.stop(t+d+.05);
}
const SFX={
  plop(){tone(300,0,.12,'sine',.12);tone(520,.04,.14,'sine',.08)},
  coin(){tone(1320,0,.12,'square',.05);tone(1760,.08,.3,'square',.05)},
  bell(){[196,392,588,790].forEach((f,i)=>tone(f,0,2.4-i*.4,'sine',.22/(i+1)))},
  gold(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.45,'triangle',.1))},
  chime(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.13,1,'sine',.1))},
  boom(){tone(90,0,.5,'sawtooth',.12);tone(60,.05,.6,'sine',.2)},
  rattle(){for(let i=0;i<9;i++)tone(700+Math.random()*800,i*.07,.05,'square',.04)},
  stick(){tone(1900,0,.25,'triangle',.08);tone(2500,.05,.2,'triangle',.05)},
  whoosh(){tone(200,0,.5,'sawtooth',.05);tone(900,.05,.4,'triangle',.05)},
  clink(){tone(2300,0,.18,'triangle',.08);tone(3100,.03,.22,'sine',.05)},
  pour(){tone(900,0,.3,'sine',.03);tone(1300,.08,.3,'sine',.03)},

};
const sfxT={};
function sfx(n){if(!AC||!P.sfx)return;const t=performance.now();if(t-(sfxT[n]||0)<120)return;sfxT[n]=t;try{SFX[n]()}catch(e){}}
// ================= อ่านออกเสียงไทย =================
let lastSpoke=performance.now();let voices=[];const tts={q:[],busy:false,id:0};
if('speechSynthesis' in window){const lv=()=>voices=speechSynthesis.getVoices();lv();speechSynthesis.onvoiceschanged=lv}
function clean(s,m){
  return String(s).replace(/https?:\/\/\S+/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'')
    .replace(/5{3,}/g,'ฮ่าๆๆ').replace(/(.)\1{3,}/gu,'$1$1').trim().slice(0,m||90);
}
function speak(text,o){
  o=o||{};if(!audioOn||P.tts==='off'||!('speechSynthesis' in window))return;
  text=clean(text,o.long?240:90);if(!text)return;
  if(o.pri){tts.q=tts.q.filter(x=>x.pri);tts.q.push({t:text,pri:1,rate:o.rate,pitch:o.pitch})}
  else{if(tts.q.length>=2)return;tts.q.push({t:text,rate:o.rate,pitch:o.pitch})}
  nextSpeak();
}
function nextSpeak(){
  if(tts.busy||!tts.q.length)return;
  const it=tts.q.shift(),u=new SpeechSynthesisUtterance(it.t),id=++tts.id;
  u.lang='th-TH';const v=voices.find(v=>/^th/i.test(v.lang));if(v)u.voice=v;
  u.rate=it.rate||1;u.pitch=it.pitch||1;u.volume=Math.min(1,P.vol+.2);
  tts.busy=true;lastSpoke=performance.now();duck(1);const done=()=>{if(tts.id===id){tts.busy=false;lastSpoke=performance.now();duck(0);nextSpeak()}};
  u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  setTimeout(()=>{if(tts.busy&&tts.id===id){speechSynthesis.cancel();done()}},15000);
}


// ================= คำเชิญพูดเป็นระยะๆ ตอนเงียบ =================
// ปรับความถี่ด้วย ?talk=วินาที (ค่าเริ่มต้น 40, ขั้นต่ำ 15)  ปิดด้วย ?talk=0
const TALK=q.get('talk')==='0'?0:Math.max(15,+(q.get('talk')||40));
const INVITE=[
 'ยินดีต้อนรับสู่ '+TITLE+' ค่ะ กดใจหนึ่งครั้ง ตัวละครของคุณจะได้นั่งโต๊ะทันทีเลยนะคะ',
 'พิมพ์คำว่า เต้น เพื่อเปลี่ยนท่าเต้น หรือพิมพ์ ชนแก้ว เพื่อชนแก้วกับเพื่อนที่นั่งใกล้ที่สุดได้เลยค่ะ',
 'กดใจครบหนึ่งร้อยครั้ง จะได้ย้ายไปนั่งโซฟาสุดหรู ที่ด้านหน้าเลยนะคะ',
 'ข้อความของทุกคนจะขึ้นจอใหญ่ด้านซ้ายบน ลองพิมพ์ทักทายกันได้เลยค่ะ',
 'พิมพ์คำว่า เปลี่ยน เพื่อเปลี่ยนลุคของตัวเอง ได้ไม่จำกัดครั้งเลยนะคะ',
 'ใครส่งของขวัญ จะได้ผลพิเศษในร้าน ดูรายละเอียดที่แถบด้านบนได้เลยค่ะ',
 'ช่วยกันกดใจให้ถึงเป้าหมายโชว์ แล้วทั้งร้านจะได้เต้นพร้อมกันค่ะ',
 'ขอบคุณทุกคนที่มาสนุกด้วยกันนะคะ ขอให้มีความสุขตลอดทั้งคืนค่ะ'
];
let invOrder=[],invN=0;
function nextInvite(){
  invN++;
  const n=ppl.size,sit=[...ppl.values()].filter(p=>p.seat&&p.seat.kind!=='stand').length;
  if(invN%4===0&&n>0)return 'ตอนนี้มีผู้ร่วมงาน '+n+' คน นั่งโต๊ะแล้ว '+sit+' คน ขอบคุณที่มาสนุกด้วยกันนะคะ';
  if(!invOrder.length)invOrder=INVITE.map((_,i)=>i).sort(()=>Math.random()-.5);

// ================= ตัวกรองคำไม่เหมาะสม =================
const norm=s=>String(s).toLowerCase().replace(/[\s.\-_*~'"`|,/\\+=()\[\]{}<>:;\u00b7\u2022\u200b-\u200d\ufeff]/g,'').replace(/(.)\1{2,}/gu,'$1');
const noTone=s=>s.replace(/[\u0E48-\u0E4B]/g,'');
const TH_BAD=['เหีย','สัส','ควย','เย็ด','เชีย','เงียน','ตอแหล','ระยำ','เสือก','กระหรี','ดอกทอง','สนตีน','แตด','ชักวาว','ไอสัตว์','อีสัตว์','ไปตาย','ชาติหมา','ขายตัว'];
const EXTRA=(q.get('ban')||'').split(',').map(w=>noTone(norm(w))).filter(Boolean);
const EN_BAD=/fuck|shit|bitch|asshole|nigg(a|er)|whore|slut|pussy|porn|faggot/;
function isBad(s){
  s=String(s||'');const n=norm(s),th=noTone(n);
  if(/https?:|www\.|\.com|line\.me|@\w{3,}|\d{9,}/i.test(s))return true;
  if(TH_BAD.some(w=>th.includes(w))||EXTRA.some(w=>th.includes(w)))return true;
  if(/หี(?!บ)/.test(th)||/แม่ง|ห่า(?![งน])/.test(n))return true;
  const en=n.replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/@/g,'a').replace(/\$/g,'s');
  return EN_BAD.test(en)||/\b(dick|rape|raped|rapist|cunt)\b/.test(s.toLowerCase());
}

// ================= ตรรกะเกม =================
function burst(x,y,c,n,sp,gv){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7+Math.random()*.6,c,g:gv||0})}}
function firework(x,y,c,n){n=n||34;for(let i=0;i<n;i++){const a=i/n*6.283,s=rnd(80,120);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1.2,c,g:45,add:1})}}
function confetti(n){for(let i=0;i<n;i++)parts.push({x:rnd(10,530),y:rnd(300,320),vx:rnd(-30,30),vy:rnd(20,80),l:rnd(2.2,3.6),c:COL[i%8],g:110,conf:1})}
function loadAvatar(p,u){
  const im=new Image();im.referrerPolicy='no-referrer';let tried=0;
  im.onload=()=>{p.img=im};
  im.onerror=()=>{if(!tried&&location.host){tried=1;im.src=u}};   // ถ้าพร็อกซีไม่ได้ ลองโหลดตรง
  im.src=location.host&&/^https:/i.test(u)?'/avatar?u='+encodeURIComponent(u):u;
}
function look(p){const h=(Math.random()*1e9)>>>0;p.v=h%3;p.c1=COL[h%8];p.c2=COL[(h>>>3)%8];p.pants=['#1b1b3a','#2a1850','#12263f','#3a1530'][(h>>>5)%4];p.acc=(h>>>9)%3}
function takeSeat(p,k){
  const arr=OCC[k];let idx=-1;
  if(k==='stand'){const free=[];arr.forEach((o,i)=>{if(!o)free.push(i)});if(free.length)idx=free[(Math.random()*free.length)|0]}
  else idx=arr.findIndex(o=>!o);
  if(idx<0)return false;arr[idx]=p.id;p.seat={kind:k,idx};return true;
}
function want(p){if(p.tmpT>0)return p.tmp;if(p.likes>=100)return 'sofa';if(p.likes>=1||p.sat)return 'table';return 'stand'}
function ensureSeat(p){
  const w=want(p);
  if(p.seat&&p.seat.kind===w)return;
  const old=p.seat;
  for(const k of [w].concat(FALL[w]||[])){
    if(old&&old.kind===k)return;
    p.seat=null;
    if(takeSeat(p,k)){if(old)OCC[old.kind][old.idx]=null;return}
    p.seat=old;
  }
}
function dropP(p){if(p.seat)OCC[p.seat.kind][p.seat.idx]=null;ppl.delete(p.id)}
function getP(id,name,avatar){
  let p=ppl.get(id);
  if(!p){
    if(ppl.size>=MAXP){let v=null;for(const x of ppl.values())if(!v||(x.seat&&x.seat.kind==='stand'&&(!v.seat||v.seat.kind!=='stand'||x.last<v.last)))v=x;if(!v)v=[...ppl.values()][0];if(v)dropP(v)}
    const h=hash(id);
    p={id,name:(isBad(name||id)?'ผู้ร่วมงาน':(name||id)).slice(0,12),skin:SKIN[(h>>>7)%4],mv:h%4,off:rnd(0,1),x:0,y:0,seat:null,
       likes:0,gv:0,score:0,dance:0,spot:0,glow:0,item:'',itemT:0,tmp:'',tmpT:0,crown:0,bub:'',bubT:0,clink:0,cd:0,sat:false,img:null,last:0};
    look(p);
    ppl.set(id,p);ensureSeat(p);
    if(!p.seat){let v=null;for(const x of ppl.values())if(x!==p&&x.seat&&x.seat.kind==='stand'&&(!v||x.last<v.last))v=x;if(v){dropP(v);ensureSeat(p)}}
    const S=p.seat?SEATS[p.seat.kind][p.seat.idx]:{x:270,y:900};p.x=S.x;p.y=S.y+24;
    if(avatar)loadAvatar(p,avatar);
    burst(p.x,p.y-30,p.c1,8,60);
  }
  p.last=performance.now();return p;
}

function giftFx(p,m){
  const d=Math.max(1,m.diamonds||1);let G=GF.find(x=>x.k.some(k=>String(m.gift||'').toLowerCase().includes(k)));
  if(!G){const fx=d>=500?'show':d>=200?'crown':d>=60?'vip':d>=20?'top':d>=5?'spot':'screen';G=GF.find(x=>x.fx===fx)||GF[0]}
  lastGift=(m.gift||'?')+' → '+G.fx;
  p.gv+=d;p.score+=Math.max(5,d);Ctot+=d;
  const nm=p.name;
  switch(G.fx){
    case 'screen':pushScreen(p,'ส่งกุหลาบ 🌹 ให้ร้าน',10,true);break;

const CMD=[['จองโต๊ะ','book'],['ชนแก้ว','clink'],['เต้น','dance'],['เปลี่ยน','change']];
function cmdOf(t){const x=t.replace(/[\s"“”'`!！.]/g,'');for(const c of CMD)if(x.startsWith(c[0]))return c[1];return ''}
function runCmd(p,cmd){
  if(cmd==='book'){p.sat=true;pushScreen(p,'จองโต๊ะแล้ว 🥂',3);tick(p,'เชิญคุณ '+p.name+' นั่งโต๊ะ');sfx('chime')}
  else if(cmd==='dance'){p.dance=Math.max(p.dance,12);p.mv=(p.mv+1)%4;floats.push({x:p.x,y:p.y-60,t:'💃 เปลี่ยนท่า',s:13,c:'#ffd9f0',l:1.5});sfx('plop')}
  else if(cmd==='change'){look(p);burst(p.x,p.y-30,'#fff',14,90);floats.push({x:p.x,y:p.y-60,t:'✨ เปลี่ยนลุค',s:13,c:'#ffd9f0',l:1.5});sfx('plop')}
  else if(cmd==='clink'){
    let o=null,bd=1e9;for(const x of ppl.values()){if(x===p)continue;const d=Math.hypot(x.x-p.x,x.y-p.y);if(d<bd){bd=d;o=x}}
    if(o){p.clink=1.4;o.clink=1.4;sfx('clink');floats.push({x:(p.x+o.x)/2,y:Math.min(p.y,o.y)-60,t:'🥂 ชนแก้ว!',s:15,c:'#fff',l:1.6});tick(p,p.name+' ชนแก้วกับ '+o.name)}
  }
}
function handle(m){
  if(m.type==='status'){status=m;return}
  const p=getP(m.id,m.name,m.avatar);
  if(m.type==='chat'){
    const t=(m.text||'').trim();if(!t||isBad(t))return;
    const cmd=cmdOf(t);
    if(cmd&&performance.now()>p.cd){p.cd=performance.now()+3000;runCmd(p,cmd);return}
    p.bub=t.slice(0,20);p.bubT=4;p.score+=1;pushScreen(p,t,4);
    if(P.tts==='all')speak('คุณ'+p.name+' บอกว่า '+t);
  }
  else if(m.type==='like'){
    const n=Math.min(m.n||1,30),before=p.likes;p.likes+=n;Ltot+=n;p.score+=n;p.dance=Math.min(25,p.dance+1.2*Math.min(n,10));
    if(before<1&&p.likes>=1){pushScreen(p,'ได้นั่งโต๊ะแล้ว 🥂',3);tick(p,'เชิญคุณ '+p.name+' นั่งโต๊ะ');sfx('chime')}
    if(before<100&&p.likes>=100){tick(p,'ยินดีด้วย! '+p.name+' ย้ายไปนั่งโซฟา');sfx('gold');p.glow=5;p.spot=Math.max(p.spot,10)}
    checkGoals();
  }
  else if(m.type==='gift')giftFx(p,m);
  else if(m.type==='follow'){p.score+=3;p.spot=Math.max(p.spot,15);tick(p,'ขอบคุณคุณ '+p.name+' ที่กดติดตาม');sfx('chime')}
  else if(m.type==='share'){p.score+=3;cheersT=4;sfx('clink');confetti(40);tick(p,'ขอบคุณคุณ '+p.name+' ที่แชร์ไลฟ์ — ชนแก้วกันทั้งร้าน!')}
}

function connectWS(){
  const host=location.host||'localhost:3000';
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+host);
  const user=q.get('user');
  ws.onopen=()=>{wsOk=true;if(user)ws.send(JSON.stringify({type:'setUser',user}))};
  ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(_){}};
  ws.onclose=()=>{wsOk=false;status={ok:false};setTimeout(connectWS,2000)};
}

function update(dt){
  flash=Math.max(0,flash-dt);showT=Math.max(0,showT-dt);cheersT=Math.max(0,cheersT-dt);towerT=Math.max(0,towerT-dt);
  if(screenQ.length&&(screenQ[0].t-=dt)<=0)screenQ.shift();
  if(tickQ.length&&(tickQ[0].t-=dt)<=0)tickQ.shift();
  for(const p of ppl.values()){
    p.dance-=dt;p.spot-=dt;p.glow-=dt;p.bubT-=dt;p.clink-=dt;p.crown-=dt;p.itemT-=dt;if(p.itemT<=0)p.item='';
    if(p.tmpT>0){p.tmpT-=dt;if(p.tmpT<=0)p.tmp=''}
    ensureSeat(p);
    const S=p.seat?SEATS[p.seat.kind][p.seat.idx]:{x:p.x,y:p.y},k=Math.min(1,dt*3.2);
    p.x+=(S.x-p.x)*k;p.y+=(S.y-p.y)*k;
  }
  for(const f of floats){f.l-=dt;f.y-=24*dt}floats=floats.filter(f=>f.l>0);
  parts=parts.filter(p=>(p.l-=dt)>0);for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.99}
  if(banner&&(banner.life-=dt)<=0)banner=null;
}

  if(p.img&&p.img.complete&&p.img.naturalWidth){try{g.drawImage(p.img,cx-r,cy-r,2*r,2*r)}catch(e){p.img=null}}
  else{const gr=g.createLinearGradient(0,cy-r,0,cy+r);gr.addColorStop(0,p.c1);gr.addColorStop(1,p.c2);g.fillStyle=gr;g.fillRect(cx-r,cy-r,2*r,2*r);
    g.fillStyle='#fff';g.font='bold '+Math.round(r*1.1)+'px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText([...p.name][0]||'?',cx,cy+1)}
  g.restore();g.strokeStyle='#fff';g.lineWidth=Math.max(1.5,r*.14);g.beginPath();g.arc(cx,cy,r,0,6.28);g.stroke();
}
function fitText(s,maxW,size,color,x,y,align){
  g.font='bold '+size+'px '+FONT;let t=String(s);
  while(t.length>3&&g.measureText(t).width>maxW)t=t.slice(0,-2);
  if(t.length<String(s).length)t+='…';txt(t,x,y,size,color,align);
}
function drawP(p,t,beat,R){
  const k=p.seat?p.seat.kind:'stand',sit=k==='table'||k==='sofa'||k==='vip';
  const cheer=cheersT>0&&sit,dn=p.dance>0||showT>0||k==='top'||k==='dj',ck=p.clink>0||cheer;
  const ph=Math.PI*(beat+p.off),bob=dn?Math.abs(Math.sin(ph))*3:Math.sin(t*1.6+p.off*6)*.7;
  const legH=sit?0:R*.55,torH=R,x=p.x,y=p.y,topT=y-legH-torH-bob,hy=topT-R*.5;
  if(!sit)ell(x,y+1,R*.8,R*.25,'rgba(0,0,0,.35)');
  if(p.glow>0||p.crown>0)halo(x,hy,R*2.4,'rgba(255,214,90,.4)');
  if(!sit){g.fillStyle=p.pants;g.fillRect(x-R*.42,y-legH,R*.32,legH);g.fillRect(x+R*.1,y-legH,R*.32,legH)}
  // ลำตัว (ชุดสามแบบ)
  if(p.v===0){g.fillStyle=p.c1;g.beginPath();g.moveTo(x-R*.5,topT);g.lineTo(x+R*.5,topT);g.lineTo(x+R*.75,topT+torH);g.lineTo(x-R*.75,topT+torH);g.closePath();g.fill();g.fillStyle=p.c2;g.fillRect(x-R*.55,topT+torH*.4,R*1.1,R*.18)}
  else if(p.v===1){g.fillStyle='#1b1b3a';rr(x-R*.62,topT,R*1.24,torH,R*.2);g.fill();g.fillStyle='#fff';g.beginPath();g.moveTo(x-R*.25,topT);g.lineTo(x+R*.25,topT);g.lineTo(x,topT+torH*.6);g.closePath();g.fill();g.fillStyle=p.c2;g.fillRect(x-R*.07,topT+R*.15,R*.14,torH*.5)}
  else{g.fillStyle=p.c1;rr(x-R*.62,topT,R*1.24,torH,R*.25);g.fill();g.fillStyle=p.c2;g.fillRect(x-R*.62,topT+torH*.55,R*1.24,R*.16)}
  // แขน
  let lx=x-R*.78,ly=topT+R*.6,rx=x+R*.78,ry=topT+R*.6;
  if(dn){const a=Math.sin(ph*2);ly-=Math.max(0,a)*R*.9;ry-=Math.max(0,-a)*R*.9}
  if(ck){rx=x+R*.9;ry=topT-R*.1+Math.sin(t*14)*1}
  g.strokeStyle=p.v===1?'#1b1b3a':p.c1;g.lineWidth=R*.3;g.lineCap='round';g.beginPath();g.moveTo(x-R*.55,topT+R*.25);g.lineTo(lx,ly);g.moveTo(x+R*.55,topT+R*.25);g.lineTo(rx,ry);g.stroke();g.lineCap='butt';
  ell(lx,ly,R*.19,R*.19,p.skin);ell(rx,ry,R*.19,R*.19,p.skin);
  if(sit||p.item||ck){ // แก้ว/ของในมือ
    if(p.item){g.font=Math.round(R*.8)+'px '+FONT;g.textAlign='center';g.textBaseline='middle';g.fillText(p.item,rx+R*.2,ry-R*.5)}
    else{g.fillStyle='rgba(255,255,255,.85)';g.beginPath();g.moveTo(rx-R*.2,ry-R*.55);g.lineTo(rx+R*.2,ry-R*.55);g.lineTo(rx+R*.08,ry-R*.1);g.lineTo(rx-R*.08,ry-R*.1);g.closePath();g.fill();g.fillStyle=p.c2;g.fillRect(rx-R*.15,ry-R*.38,R*.3,R*.18)}
  }
  if(ck){g.fillStyle='#fff';g.font=Math.round(R*.8)+'px '+FONT;g.textAlign='center';g.fillText('✦',rx+R*.2,ry-R*.9-Math.abs(Math.sin(t*8))*3)}
  // หัว = รูปโปรไฟล์
  if(dn){g.strokeStyle=hsl(t*70+p.off*300,95,65,.9);g.lineWidth=3;g.beginPath();g.arc(x,hy,R+2.5,0,6.28);g.stroke()}
  drawAv(p,x,hy,R);
  if(k==='dj'){g.strokeStyle='#14142e';g.lineWidth=R*.28;g.beginPath();g.arc(x,hy,R*1.02,3.25,6.17);g.stroke();ell(x-R*1.02,hy,R*.26,R*.4,'#14142e');ell(x+R*1.02,hy,R*.26,R*.4,'#14142e')}
  if(p.crown>0){g.fillStyle='#ffd23f';g.beginPath();g.moveTo(x-R*.7,hy-R*.9);g.lineTo(x-R*.6,hy-R*1.8);g.lineTo(x-R*.25,hy-R*1.25);g.lineTo(x,hy-R*2);g.lineTo(x+R*.25,hy-R*1.25);g.lineTo(x+R*.6,hy-R*1.8);g.lineTo(x+R*.7,hy-R*.9);g.closePath();g.fill()}
  else if(p.acc===0){g.fillStyle=p.c2;g.beginPath();g.moveTo(x+R*.7,hy-R*.75);g.lineTo(x+R*1.45,hy-R*1.2);g.lineTo(x+R*1.45,hy-R*.3);g.closePath();g.fill();g.beginPath();g.moveTo(x+R*.7,hy-R*.75);g.lineTo(x,hy-R*1.2);g.lineTo(x,hy-R*.3);g.closePath();g.fill()}
  else if(p.acc===1){g.fillStyle='#ffe066';g.font='bold '+Math.round(R*.9)+'px '+FONT;g.textAlign='center';g.fillText('✦',x-R*.75,hy-R*.8)}
  txt(p.name.slice(0,9),x,y+(sit?R*.42:R*.62),10,'#fff');
  if(p.bubT>0&&p.bub){
    g.font='bold 12px '+FONT;const w=g.measureText(p.bub).width+16,by=hy-R-16,cx=Math.max(w/2+4,Math.min(W-w/2-4,x));
    g.globalAlpha=Math.min(1,p.bubT);g.fillStyle='#fff';rr(cx-w/2,by-11,w,22,11);g.fill();txt(p.bub,cx,by,12,'#2a0f4d','center',false);g.globalAlpha=1;
  }
}
function drawTower(t){
  const f=Ctot/CG,cups=[[422,468],[442,468],[462,468],[432,458],[452,458],[442,448]];
  cups.forEach((c,i)=>{
    const lv=towerT>0?1:Math.max(0,Math.min(1,f*6-i));
    g.save();g.beginPath();g.moveTo(c[0]-8,c[1]-9);g.lineTo(c[0]+8,c[1]-9);g.lineTo(c[0]+3,c[1]);g.lineTo(c[0]-3,c[1]);g.closePath();g.fillStyle='rgba(255,255,255,.16)';g.fill();g.clip();
    if(lv>0){g.fillStyle=['#ff9a3c','#ff5c9d','#ffd23f'][i%3];g.fillRect(c[0]-9,c[1]-9*lv,18,9*lv)}g.restore();
    g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=1.1;g.beginPath();g.moveTo(c[0]-8,c[1]-9);g.lineTo(c[0]+8,c[1]-9);g.lineTo(c[0]+3,c[1]);g.lineTo(c[0]-3,c[1]);g.closePath();g.stroke();
  });
  if(towerT>0){g.strokeStyle='rgba(255,170,60,.95)';g.lineWidth=3;g.beginPath();g.moveTo(442,424);g.lineTo(442,446);g.stroke();
    for(let i=0;i<5;i++){g.fillStyle='rgba(255,220,140,'+(.4+.5*Math.random())+')';g.fillRect(rnd(414,470),rnd(446,474),2,3)}}
}
function draw(){
  const t=performance.now()/1000,beat=getBeat(),pulse=Math.pow(1-(beat%1),3),R=HR();
  g.drawImage(bgc,0,0);
  // ไฟประดับกระพริบ
  [[330,350],[352,372]].forEach((c,j)=>{for(let i=0;i<=18;i++){const u=i/18,y=(1-u)*(1-u)*c[0]+2*(1-u)*u*c[1]+u*u*c[0];g.fillStyle=hsl(i*40+j*90+t*40,90,66,.55+.45*Math.sin(t*5+i+j));g.beginPath();g.arc(u*W,y,2.6,0,6.28);g.fill()}});
  BILL.forEach((b,i)=>{g.fillStyle=(i+Math.floor(t*3))%2?'#ffe9a8':'#7a6bff';g.beginPath();g.arc(b[0],b[1],2.2,0,6.28);g.fill()});
  // ลำโพงเต้นตามจังหวะ + อีควอไลเซอร์ที่เครื่องดีเจ
  g.fillStyle='rgba(255,255,255,'+(.12+.25*pulse)+')';[191,353].forEach(cx=>{g.beginPath();g.arc(cx,372,9+3*pulse,0,6.28);g.fill()});
  // สระ
  g.save();g.beginPath();g.ellipse(270,466,84,24,0,0,6.28);g.clip();g.fillStyle='rgba(255,255,255,.28)';
  for(let i=0;i<9;i++){g.fillRect(((i*47)+t*14)%190+185,448+(i*13)%38,26,2)}g.restore();
  // เลเซอร์ตอนโชว์
  if(showT>0){g.save();g.globalCompositeOperation='lighter';g.lineWidth=2.4;
    for(let i=0;i<9;i++){const a=-1.25+i*.31+Math.sin(t*2+i)*.2;g.strokeStyle=hsl(t*60+i*40,95,60,.55);g.beginPath();g.moveTo(272,404);g.lineTo(272+Math.sin(a)*520,404+Math.cos(a)*440);g.stroke()}g.restore()}
  drawTower(t);
  txt(OCC.vip.some(o=>!o)?'ว่าง · ส่ง Hand Heart':'เต็ม · รอคิว',80,459,10,'#fff');
  // สปอตไลต์
  const arr=[...ppl.values()];
  arr.filter(p=>p.spot>0).forEach(p=>{const gr=g.createLinearGradient(0,306,0,p.y);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(255,230,160,.42)');
    g.save();g.globalCompositeOperation='lighter';g.fillStyle=gr;g.beginPath();g.moveTo(p.x-6,306);g.lineTo(p.x+6,306);g.lineTo(p.x+26,p.y);g.lineTo(p.x-26,p.y);g.closePath();g.fill();g.restore()});
  // ผู้คน: ดีเจก่อน แล้วเครื่องดีเจทับขา แล้วคนอื่นเรียงตามความลึก
  arr.filter(p=>p.seat&&p.seat.kind==='dj').forEach(p=>drawP(p,t,beat,R));
  rr(212,398,120,16,6);g.fillStyle='#150f3a';g.fill();g.strokeStyle='#7a6bff';g.lineWidth=2;g.stroke();
  for(let i=0;i<14;i++){const h=2+8*Math.abs(Math.sin(t*6+i*.8))*(showT>0?1.4:1);g.fillStyle=hsl(i*25+t*60,90,60);g.fillRect(218+i*7.4,413-h,5,h)}
  arr.filter(p=>!(p.seat&&p.seat.kind==='dj')).sort((a,b)=>a.y-b.y).forEach(p=>drawP(p,t,beat,R));
  for(const p of parts){
    g.globalAlpha=Math.max(0,Math.min(1,p.l));
    if(p.conf){g.fillStyle=p.c;g.fillRect(p.x,p.y,5,3)}
    else{g.globalCompositeOperation=p.add?'lighter':'source-over';g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,p.add?3:4,p.add?3:4);g.globalCompositeOperation='source-over'}
  }
  g.globalAlpha=1;
  for(const f of floats){g.globalAlpha=Math.min(1,f.l);txt(f.t,f.x,f.y,f.s,f.c);g.globalAlpha=1}
  // ---------- ส่วนบน (ไดนามิก) ----------
  const lp=Math.max(0,Math.min(1,(Ltot-Lbase)/LG)),cp=Math.max(0,Math.min(1,Ctot/CG));
  if(lp>0){rr(8,64,Math.max(22,258*lp),22,11);const gr=g.createLinearGradient(8,0,266,0);gr.addColorStop(0,'#ff3d86');gr.addColorStop(1,'#ff9ec0');g.fillStyle=gr;g.fill()}
  if(cp>0){rr(274,64,Math.max(22,258*cp),22,11);const gr=g.createLinearGradient(274,0,532,0);gr.addColorStop(0,'#d9a21b');gr.addColorStop(1,'#ffe27a');g.fillStyle=gr;g.fill()}
  txt('❤️ '+(Ltot-Lbase)+' / '+LG+' โชว์',137,75,13,'#fff');txt('🪙 '+Ctot+' / '+CG+' ทาวเวอร์น้ำผลไม้',403,75,13,'#fff');
  // โพเดียมเจ้าภาพ
  const top=arr.filter(p=>p.gv>0).sort((a,b)=>b.gv-a.gv).slice(0,3),ord=[[1,38,16,'#c9d0e6'],[0,92,26,'#ffd23f'],[2,146,12,'#e59a5a']];
  ord.forEach(o=>{const p=top[o[0]],cx=o[1],bt=262-o[2];
    rr(cx-22,bt,44,o[2],4);g.fillStyle=o[3];g.fill();txt(String(o[0]+1),cx,bt+o[2]/2+1,o[2]>14?12:10,'#3a2a00','center',false);
    if(p){drawAv(p,cx,bt-34,13);if(o[0]===0){g.font='15px '+FONT;g.textAlign='center';g.fillText('👑',cx,bt-54)}txt(p.name.slice(0,6)+' · '+p.gv,cx,bt-14,10,'#fff')}
    else{g.strokeStyle='rgba(255,255,255,.35)';g.setLineDash([3,3]);g.lineWidth=1.5;g.beginPath();g.arc(cx,bt-34,13,0,6.28);g.stroke();g.setLineDash([]);txt('?',cx,bt-34,12,'rgba(255,255,255,.5)','center',false)}});
  // จอใหญ่: ข้อความ/ผู้ได้ขึ้นจอ
  const sc=screenQ[0];
  if(sc){drawAv(sc.p,120,338,22);fitText(sc.p.name,200,14,'#fff',120,368,'center');fitText(sc.text,206,12.5,'#ffe9a8',120,384,'center')}
  else{txt('พิมพ์ข้อความ ขึ้นจอได้เลย 💬',120,350,13,'#cbb6f5','center',false)}
  // แถบข่าวขอบคุณ
  const tk=tickQ[0];
  if(tk){drawAv(tk.p,24,288,9);g.save();g.beginPath();g.rect(38,277,W-52,22);g.clip();fitText(tk.text,W-60,13,'#fff',42,288,'left');g.restore()}
  else txt('ยินดีต้อนรับสู่ '+TITLE+' 🥂',W/2,288,13,'#cbb6f5','center',false);
  if(flash>0){g.fillStyle='rgba(255,255,255,'+Math.min(.28,flash*.25)+')';g.fillRect(0,300,W,H-300)}
  if(banner){
    const a=Math.min(1,banner.life,(4.5-banner.life)*4+.2);g.globalAlpha=Math.max(0,a);
    rr(40,316,W-80,70,18);g.fillStyle='rgba(18,8,52,.9)';g.fill();g.strokeStyle='#ffd23f';g.lineWidth=3;g.stroke();
    txt(banner.t1.slice(0,30),W/2,340,20,'#fff');txt(banner.t2,W/2,368,18,'#ffd23f');g.globalAlpha=1;
  }
  if(isDemo||q.has('debug')||performance.now()<20000){
    g.fillStyle=status.ok?'#3ddc97':'#ff4d6d';g.beginPath();g.arc(W-14,10,6,0,6.28);g.fill();
    const who=status.user||q.get('user')||'';
    txt(!wsOk?'ต่อเซิร์ฟเวอร์ไม่ได้':status.ok?'เชื่อมแล้ว @'+who:'ต่อ TikTok ยังไม่ติด @'+who,W-26,10,11,'#fff','right');
    if(wsOk&&!status.ok&&status.err)txt(String(status.err).slice(0,48),W-26,24,10,'#ffb3b3','right');
    if(lastGift)txt('ของขวัญล่าสุด: '+lastGift,W-26,38,10,'#9be8ff','right');
  }
}
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)})(last);
