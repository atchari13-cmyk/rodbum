<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<title>งานวัดทำบุญ LIVE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#0b0618;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,56.25vh);height:min(177.78vw,100vh)}
#demo{position:fixed;left:8px;top:8px;display:none;flex-direction:column;gap:4px;z-index:9}
body.demo #demo{display:flex}
#demo button{padding:6px 10px;font:14px Tahoma,sans-serif;cursor:pointer}
#start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,5,25,.88);z-index:20}
#start button{font:bold 22px Tahoma,sans-serif;padding:16px 30px;border-radius:30px;border:0;background:#ffd23f;color:#2a0f4d}
</style></head><body>
<canvas id="c" width="540" height="960"></canvas>
<div id="start"><button onclick="startAudio()">🔊 แตะเพื่อเริ่มเกม (เปิดเสียง)</button></div>
<div id="demo">
 <button onclick="demo('member')">🚶 เข้าร่วม</button>
 <button onclick="demo('like')">❤️ ไลก์</button>
 <button onclick="demo('chat')">💬 คอมเมนต์</button>
 <button onclick="demo('pray')">🙏 ขอพร</button>
 <button onclick="demo('gift')">🎁 ของขวัญ</button>
 <button onclick="demo('follow')">➕ ตามแล้ว</button>
 <button onclick="for(let i=0;i<10;i++)demo('member')">+10 คน</button>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const W=540,H=960,GY=520,WY0=632,WY1=815,MAX=40;
const FONT='Tahoma,"Noto Sans Thai",sans-serif';
const q=new URLSearchParams(location.search);
// ตั้งค่าผ่านลิงก์: ?tts=all|prayer|off  ?sfx=0  ?vol=0.5
const P={tts:q.get('tts')||'all',sfx:q.get('sfx')!=='0',vol:Math.min(1,+(q.get('vol')||.8))};
const isDemo=q.has('demo');if(isDemo)document.body.classList.add('demo');
const ST=[{n:'ใส่บาตร',ic:'🍚',x:66,c:'#e76f51',s:'pop'},{n:'ตีระฆัง',ic:'🔔',x:168,c:'#f4a261',s:'bell'},
 {n:'ปิดทอง',ic:'✨',x:270,c:'#e9c46a',s:'gold'},{n:'ไหว้พระ',ic:'🪔',x:372,c:'#2a9d8f',s:'chime'},{n:'ผ้าป่า',ic:'🪙',x:474,c:'#9b5de5',s:'coin'}];
const CL=['#e63946','#f4a261','#2a9d8f','#4cc9f0','#b388ff','#ffd23f','#f72585','#80ed99'];
const SK=['#ffd9b3','#f1c27d','#e0ac69','#c68642'];
const ppl=new Map();let floats=[],lants=[],parts=[],ticker=[],prayer=null,total=0,goal=100,status={ok:false};
const hash=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
const rnd=(a,b)=>a+Math.random()*(b-a);

// ================= เสียงเอฟเฟกต์ =================
let AC=null,master=null,audioOn=false;
function startAudio(){
  document.getElementById('start').style.display='none';
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=P.vol;master.connect(AC.destination);
    if('speechSynthesis' in window)speechSynthesis.speak(new SpeechSynthesisUtterance(''));audioOn=true;sfx('chime')}catch(e){}
}
function tone(f,t0,d,type,v){
  const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime+t0;
  o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);
  gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.05);
}
const SFX={
  pop(){tone(520,0,.1,'triangle',.12);tone(700,.06,.12,'triangle',.1)},
  coin(){tone(1320,0,.12,'square',.06);tone(1760,.08,.3,'square',.06)},
  bell(){[196,392,588,790].forEach((f,i)=>tone(f,0,2.4-i*.4,'sine',.22/(i+1)))},
  gold(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.45,'triangle',.1))},
  chime(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.13,1,'sine',.1))},
  big(){SFX.bell();SFX.gold();setTimeout(SFX.coin,250)}
};
const sfxT={};
function sfx(n){if(!AC||!P.sfx)return;const t=performance.now();if(t-(sfxT[n]||0)<120)return;sfxT[n]=t;try{SFX[n]()}catch(e){}}

// ================= อ่านออกเสียงภาษาไทย =================
let voices=[];const tts={q:[],busy:false,id:0};
if('speechSynthesis' in window){const lv=()=>voices=speechSynthesis.getVoices();lv();speechSynthesis.onvoiceschanged=lv}
function clean(s){
  return String(s).replace(/https?:\/\/\S+/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'')
    .replace(/5{3,}/g,'ฮ่าๆๆ').replace(/(.)\1{3,}/gu,'$1$1').trim().slice(0,90);
}
function speak(text,o){
  o=o||{};if(!audioOn||P.tts==='off'||!('speechSynthesis' in window))return;
  text=clean(text);if(!text)return;
  if(o.pri){tts.q=tts.q.filter(x=>x.pri);tts.q.push({t:text,pri:1,rate:o.rate,pitch:o.pitch})}
  else{if(tts.q.length>=2)return;tts.q.push({t:text,rate:o.rate,pitch:o.pitch})}
  nextSpeak();
}
function nextSpeak(){
  if(tts.busy||!tts.q.length)return;
  const it=tts.q.shift(),u=new SpeechSynthesisUtterance(it.t),id=++tts.id;
  u.lang='th-TH';const v=voices.find(v=>/^th/i.test(v.lang));if(v)u.voice=v;
  u.rate=it.rate||1;u.pitch=it.pitch||1;u.volume=Math.min(1,P.vol+.2);
  tts.busy=true;const done=()=>{if(tts.id===id){tts.busy=false;nextSpeak()}};
  u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  setTimeout(()=>{if(tts.busy&&tts.id===id){speechSynthesis.cancel();done()}},15000);
}

// ================= ตัวละครและเหตุการณ์ =================
function say(t){ticker.unshift({t,life:9});ticker=ticker.slice(0,2)}
function burst(x,y,c,n,sp,gv){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7+Math.random()*.6,c,g:gv||0})}}
function getP(id,name,avatar){
  let p=ppl.get(id);
  if(!p){
    if(ppl.size>=MAX){let v=null;for(const x of ppl.values())if(!v||x.last<v.last)v=x;ppl.delete(v.id)}
    const h=hash(id);
    p={id,name:(name||id).slice(0,12),color:CL[h%CL.length],skin:SK[h%SK.length],x:rnd(40,500),y:rnd(WY0,WY1),tx:0,ty:0,wt:0,
       tasks:[],act:0,pend:0,merit:0,glow:0,bub:'',bubT:0,img:null,walk:0,mv:false,last:0,ns:Math.floor(Math.random()*5)};
    if(avatar){const im=new Image();im.onload=()=>p.img=im;im.src=avatar}
    ppl.set(id,p);
  }
  p.last=performance.now();return p;
}
const task=(s,big)=>({s,big:!!big,ox:rnd(-26,26),oy:rnd(0,22)});
function addMerit(p,n){
  p.merit+=n;p.pend+=n;total+=n;
  if(total>=goal){goal+=100;celebrate()}
}
function celebrate(){
  sfx('big');say('🏮 บุญครบ! ลอยโคมทั้งลาน');
  for(let i=0;i<16;i++)lants.push({x:rnd(30,510),y:rnd(700,820),t:'',name:'',age:-i*.15,sd:Math.random()*6});
  for(let i=0;i<5;i++)setTimeout(()=>burst(rnd(80,460),rnd(280,420),CL[i%CL.length],36,260,60),i*350);
  speak('ขออนุโมทนาบุญกับทุกท่านค่ะ ลอยโคมทั้งลานแล้ว',{pri:1,rate:.95});
}
const PRAY=/^\s*(🙏|#พร|อธิษฐาน|สาธุ|ขอพร|ขอให้|ขอ(?!บ|โทษ|ถาม|เลข|หวย))/;
function handle(m){
  if(m.type==='status'){status=m;return}
  const p=getP(m.id,m.name,m.avatar);
  if(m.type==='chat'){
    const t=(m.text||'').trim();if(!t)return;
    if(PRAY.test(t)){
      const w=t.replace(/^\s*#พร\s*/,'').slice(0,60);
      lants.push({x:p.x,y:p.y-60,t:w,name:p.name,age:0,sd:Math.random()*6});if(lants.length>14)lants.shift();
      prayer={name:p.name,text:w,life:14};p.glow=3;addMerit(p,2);sfx('chime');say('🏮 '+p.name+' ลอยโคมขอพร');
      speak(p.name+' ขอพรว่า '+w,{pri:1,rate:.9,pitch:1.05});
    }else{
      p.bub=t.slice(0,24);p.bubT=3.5;addMerit(p,1);
      if(P.tts==='all')speak('คุณ'+p.name+' บอกว่า '+t);
    }
  }
  else if(m.type==='like'){addMerit(p,Math.min(m.n||1,20));if(p.tasks.length<2)p.tasks.push(task(p.ns++%5))}
  else if(m.type==='gift'){addMerit(p,Math.max(10,m.diamonds||1));p.tasks.unshift(task(4,true));p.glow=15;
    say('🎁 '+p.name+' ถวายผ้าป่า ('+m.gift+(m.n>1?' x'+m.n:'')+')');speak(p.name+' ถวายผ้าป่า ขออนุโมทนาบุญค่ะ',{pri:1})}
  else if(m.type==='follow'){addMerit(p,3);p.tasks.push(task(3));say('➕ '+p.name+' ตามบุญ')}
  else if(m.type==='share'){addMerit(p,3);p.tasks.push(task(2));say('🔁 '+p.name+' แบ่งบุญ')}
}

// ================= เชื่อมกับตัวรับข้อมูลจาก TikTok =================
function connectWS(){
  const host=location.host||'localhost:3000';
  const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+host);
  const user=q.get('user');
  ws.onopen=()=>{if(user)ws.send(JSON.stringify({type:'setUser',user}))};
  ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(_){}};
  ws.onclose=()=>{status={ok:false};setTimeout(connectWS,2000)};
}
connectWS();

// ---- ปุ่มจำลอง (เปิดด้วย /?demo) ----
const NAMES=['น้องเอ','พี่บอล','มะลิ','ต้นกล้า','แมวส้ม','ลุงหมึก','ฟ้าใส','ปังปอนด์','เจ๊นุ้ย','บีม','ก้อย','โอม'];
const WISH=['ขอให้สุขภาพแข็งแรง','ขอให้ถูกหวยรางวัลที่หนึ่ง','ขอให้ครอบครัวมีความสุข','อธิษฐานให้สอบผ่านนะ','ขอให้งานราบรื่นทุกอย่าง'];
function demo(type){
  const nm=NAMES[Math.floor(Math.random()*NAMES.length)],id=type==='member'?nm+Math.floor(Math.random()*999):nm;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  if(type==='pray')return handle({type:'chat',id,name:nm,text:pick(WISH)});
  handle({type,id,name:nm,text:pick(['สู้ๆ','งานวัดสนุกมาก','555','สวัสดีทุกคน']),n:5,gift:'Rose',diamonds:Math.random()<.5?1:150});
}

// ================= ฟิสิกส์/ตรรกะ =================
function move(p,tx,ty,sp,dt){const dx=tx-p.x,dy=ty-p.y,d=Math.hypot(dx,dy);if(d>3){p.x+=dx/d*sp*dt;p.y+=dy/d*sp*dt;p.walk+=dt*9;p.mv=true;return false}return true}
function doAct(p,t){
  const st=ST[t.s],n=Math.max(1,p.pend);p.pend=0;
  floats.push({x:p.x,y:p.y-62,t:'+'+n+' บุญ',s:15,c:'#ffe27a',l:1.8});
  floats.push({x:st.x,y:588,t:st.ic,s:28,c:'#fff',l:1.5});
  burst(st.x,575,st.c,12,150);sfx(t.big?'big':st.s);
  if(t.big){burst(st.x,560,'#ffd23f',44,320,80);burst(st.x,560,'#fff',20,200,60)}
}
function update(dt){
  for(const p of ppl.values()){
    p.bubT-=dt;p.glow-=dt;p.mv=false;
    if(p.act>0){p.act-=dt}
    else if(p.tasks.length){
      const t=p.tasks[0],st=ST[t.s];
      if(move(p,st.x+t.ox,WY0+t.oy,95,dt)){p.act=1.6;doAct(p,t);p.tasks.shift()}
    }else{
      p.wt-=dt;if(p.wt<=0){p.wt=rnd(2,6);p.tx=rnd(30,510);p.ty=rnd(WY0,WY1)}
      move(p,p.tx,p.ty,34,dt);
    }
  }
  for(const l of lants){l.age+=dt;if(l.age>0){l.y-=(l.y>270?26:6)*dt;l.x+=Math.sin(l.age*1.2+l.sd)*12*dt}}
  lants=lants.filter(l=>l.age<20);
  for(const f of floats){f.l-=dt;f.y-=28*dt}floats=floats.filter(f=>f.l>0);
  parts=parts.filter(p=>(p.l-=dt)>0);for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97}
  for(const t of ticker)t.life-=dt;ticker=ticker.filter(t=>t.life>0);
  if(prayer&&(prayer.life-=dt)<=0)prayer=null;
}

// ================= ฉากพื้นหลัง (วาดครั้งเดียว) =================
const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;
(function(){
  const x=bgc.getContext('2d');
  let gr=x.createLinearGradient(0,0,0,GY);gr.addColorStop(0,'#12062a');gr.addColorStop(1,'#6a2c70');
  x.fillStyle=gr;x.fillRect(0,0,W,GY);
  for(let i=0;i<70;i++){x.fillStyle='rgba(255,255,255,'+(.3+Math.random()*.6)+')';x.fillRect(rnd(0,W),rnd(230,470),1.6,1.6)}
  x.fillStyle='#fff3c4';x.beginPath();x.arc(452,278,22,0,6.28);x.fill();
  x.fillStyle='#2b1252';x.beginPath();x.arc(462,272,19,0,6.28);x.fill();
  // เจดีย์ทอง
  x.fillStyle='#d9a21b';x.fillRect(48,492,84,28);x.fillRect(58,470,64,22);
  x.beginPath();x.moveTo(62,470);x.quadraticCurveTo(62,402,90,386);x.quadraticCurveTo(118,402,118,470);x.fill();
  x.fillRect(86,338,8,50);x.beginPath();x.moveTo(90,306);x.lineTo(83,342);x.lineTo(97,342);x.fill();
  x.fillStyle='#f6d365';x.fillRect(76,420,6,50);
  // ศาลาวัด
  x.fillStyle='#f3e2b3';x.fillRect(198,452,144,68);x.fillStyle='#5a1a1a';x.fillRect(255,474,30,46);
  x.fillStyle='#d9a21b';x.fillRect(198,452,8,68);x.fillRect(334,452,8,68);
  const roof=(a,b,c,d,e,f)=>{x.fillStyle='#b5172b';x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.lineTo(e,f);x.closePath();x.fill();x.strokeStyle='#f6d365';x.lineWidth=3;x.stroke()};
  roof(168,456,270,394,372,456);roof(200,408,270,350,340,408);roof(236,362,270,320,304,362);
  x.strokeStyle='#f6d365';x.lineWidth=3;x.beginPath();x.moveTo(270,320);x.lineTo(270,298);x.stroke();
  // ต้นโพธิ์
  x.fillStyle='#5b3a29';x.fillRect(466,470,14,50);x.fillStyle='#1f6f50';
  [[473,448,30],[447,466,24],[500,462,24],[473,424,26]].forEach(a=>{x.beginPath();x.arc(a[0],a[1],a[2],0,6.28);x.fill()});
  // พื้น
  gr=x.createLinearGradient(0,GY,0,H);gr.addColorStop(0,'#6b4630');gr.addColorStop(1,'#3a2418');
  x.fillStyle=gr;x.fillRect(0,GY,W,H-GY);
  x.strokeStyle='rgba(255,255,255,.12)';x.lineWidth=2;x.beginPath();x.moveTo(0,GY+1);x.lineTo(W,GY+1);x.stroke();
  // สายไฟ
  x.strokeStyle='#6b4a99';x.lineWidth=2;x.beginPath();x.moveTo(0,236);x.quadraticCurveTo(W/2,280,W,236);x.stroke();
  // ซุ้มทำบุญ
  ST.forEach(s=>{
    const L=s.x-44;
    x.fillStyle='#7a5238';x.fillRect(L,570,88,34);x.fillStyle='#3a2418';x.fillRect(L+4,576,80,28);
    for(let i=0;i<8;i++){x.fillStyle=i%2?'#fff':s.c;x.fillRect(L+i*11,548,11,22)}
    for(let i=0;i<8;i++){x.fillStyle=i%2?'#fff':s.c;x.beginPath();x.arc(L+i*11+5.5,570,5.5,0,3.14);x.fill()}
    x.font='24px '+FONT;x.textAlign='center';x.textBaseline='middle';x.fillStyle='#fff';x.fillText(s.ic,s.x,592);
    x.font='bold 15px '+FONT;x.lineWidth=4;x.strokeStyle='rgba(20,5,40,.9)';x.strokeText(s.n,s.x,538);x.fillStyle='#ffe9a8';x.fillText(s.n,s.x,538);
  });
})();

// ================= วาด =================
function txt(s,x,y,size,color,align,stroke){
  g.font='bold '+size+'px '+FONT;g.textAlign=align||'center';g.textBaseline='middle';
  if(stroke!==false){g.lineWidth=4;g.strokeStyle='rgba(20,5,40,.9)';g.strokeText(s,x,y)}
  g.fillStyle=color;g.fillText(s,x,y);
}
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function wrap(s,maxW,size,maxL){
  g.font='bold '+size+'px '+FONT;const L=[];let cur='';
  for(const ch of s){if(g.measureText(cur+ch).width>maxW){L.push(cur);cur=ch;if(L.length>=maxL)break}else cur+=ch}
  if(L.length<maxL&&cur)L.push(cur);
  if([...L.join('')].length<[...s].length)L[L.length-1]=L[L.length-1].slice(0,-1)+'…';
  return L;
}
function drawP(p){
  const s=.75+.4*(p.y-WY0)/(WY1-WY0),x=p.x,y=p.y,bob=p.act>0?Math.abs(Math.sin(p.act*6))*2:(p.mv?Math.sin(p.walk)*2:0),top=y-30*s-bob;
  g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(x,y+2,12*s,4*s,0,0,6.28);g.fill();
  g.fillStyle=p.color;rr(x-9*s,top,18*s,28*s,6*s);g.fill();
  g.fillStyle='rgba(255,255,255,.75)';g.beginPath();g.moveTo(x-9*s,top);g.lineTo(x-2*s,top);g.lineTo(x+9*s,top+22*s);g.lineTo(x+3*s,top+22*s);g.fill();
  g.fillStyle=p.skin;
  if(p.act>0){g.beginPath();g.arc(x,top+5*s,4*s,0,6.28);g.fill()}
  else{g.fillRect(x-12*s,top+6*s,4*s,12*s);g.fillRect(x+8*s,top+6*s,4*s,12*s)}
  const hy=top-11*s;
  if(p.glow>0){g.strokeStyle='rgba(255,226,122,'+Math.min(1,p.glow)+')';g.lineWidth=3;g.beginPath();g.arc(x,hy,15*s,0,6.28);g.stroke()}
  g.fillStyle=p.skin;g.beginPath();g.arc(x,hy,11*s,0,6.28);g.fill();
  if(p.img){g.save();g.beginPath();g.arc(x,hy,11*s,0,6.28);g.clip();try{g.drawImage(p.img,x-11*s,hy-11*s,22*s,22*s)}catch(e){}g.restore()}
  else{g.fillStyle='#2b1b12';g.beginPath();g.arc(x,hy-2*s,11*s,3.3,6.1);g.fill()}
  txt(p.name,x,y+13*s,Math.max(11,11*s),'#fff');
  if(p.bubT>0&&p.bub){
    g.font='bold 13px '+FONT;const w=g.measureText(p.bub).width+18,by=hy-24*s;
    g.globalAlpha=Math.min(1,p.bubT);g.fillStyle='#fff';rr(x-w/2,by-12,w,24,12);g.fill();
    txt(p.bub,x,by,13,'#2a0f4d','center',false);g.globalAlpha=1;
  }
}
function drawLantern(l){
  if(l.age<0)return;
  const a=Math.min(1,(20-l.age)/3,l.age+.3);g.globalAlpha=Math.max(0,a);
  g.shadowColor='#ffb347';g.shadowBlur=18;g.fillStyle='#ff7b2e';rr(l.x-11,l.y-16,22,30,9);g.fill();
  g.shadowBlur=0;g.fillStyle='#ffd27a';rr(l.x-6,l.y-10,12,18,6);g.fill();
  g.fillStyle='#b5172b';g.fillRect(l.x-8,l.y-18,16,4);g.fillRect(l.x-8,l.y+13,16,4);
  if(l.t){g.font='bold 11px '+FONT;const t=l.t.length>16?l.t.slice(0,15)+'…':l.t,w=g.measureText(t).width+12;
    g.fillStyle='rgba(0,0,0,.45)';rr(l.x-w/2,l.y+22,w,18,9);g.fill();txt(t,l.x,l.y+31,11,'#ffe9a8','center',false)}
  g.globalAlpha=1;
}
function draw(){
  g.drawImage(bgc,0,0);
  const t=performance.now()/500;
  for(let i=0;i<=16;i++){const u=i/16,y=236*(1-u)*(1-u)+2*280*(1-u)*u+236*u*u;g.fillStyle=CL[i%CL.length];g.globalAlpha=.6+.4*Math.sin(t+i);g.beginPath();g.arc(u*W,y+4,6,0,6.28);g.fill()}
  g.globalAlpha=1;
  // ส่วนหัว
  txt('🪷 งานวัดทำบุญ',W/2,46,36,'#ffd23f');
  const base=goal-100,pr=Math.max(0,Math.min(1,(total-base)/100));
  rr(30,82,W-60,26,13);g.fillStyle='rgba(0,0,0,.4)';g.fill();
  if(pr>0){rr(30,82,Math.max(26,(W-60)*pr),26,13);const gr=g.createLinearGradient(30,0,W-30,0);gr.addColorStop(0,'#ff9d2e');gr.addColorStop(1,'#ffd23f');g.fillStyle=gr;g.fill()}
  txt('บุญรวม '+total+' / '+goal+'  → ลอยโคมทั้งลาน',W/2,95,14,'#fff');
  rr(24,120,W-48,80,14);g.fillStyle='rgba(255,255,255,.08)';g.fill();g.strokeStyle='#ffd23f';g.lineWidth=2;g.stroke();
  const R=[['❤️ กดไลก์','ทำบุญตามซุ้ม'],['🙏 พิมพ์ "ขอ…"','ลอยโคมขอพร'],['🎁 ของขวัญ','ถวายผ้าป่า'],['➕ ติดตาม / 🔁 แชร์','+3 บุญ']];
  R.forEach((r,i)=>{const x=40+(i%2)*236,y=138+Math.floor(i/2)*38;txt(r[0],x,y,16,'#fff','left',false);txt(r[1],x,y+17,13,'#cbb6f5','left',false)});
  const top=[...ppl.values()].sort((a,b)=>b.merit-a.merit).slice(0,3).filter(c=>c.merit>0);
  txt('🏵 เจ้าภาพบุญ',70,218,15,'#ffd23f');
  if(!top.length)txt('ยังไม่มีผู้ทำบุญ',300,218,15,'#cbb6f5','center',false);
  top.forEach((c,i)=>txt((i+1)+'.'+c.name.slice(0,6)+' '+c.merit,160+i*125,218,14,i?'#fff':'#ffd23f','left'));
  [...ppl.values()].sort((a,b)=>a.y-b.y).forEach(drawP);
  lants.forEach(drawLantern);
  for(const f of floats){g.globalAlpha=Math.min(1,f.l);txt(f.t,f.x,f.y,f.s,f.c);g.globalAlpha=1}
  for(const p of parts){g.globalAlpha=Math.max(0,Math.min(1,p.l));g.fillStyle=p.c;g.fillRect(p.x-2,p.y-2,4,4)}g.globalAlpha=1;
  // แผงล่าง
  rr(24,842,W-48,106,14);g.fillStyle='rgba(0,0,0,.4)';g.fill();
  if(prayer){
    txt('🏮 คำอธิษฐานจาก '+prayer.name,40,860,14,'#ffd23f','left');
    wrap(prayer.text,W-90,16,2).forEach((l,i)=>txt(l,40,882+i*20,16,'#fff','left'));
  }else txt('พิมพ์ "ขอให้…" ในคอมเมนต์ แล้วโคมของคุณจะลอยขึ้นฟ้า',W/2,868,14,'#cbb6f5','center',false);
  if(!ticker.length)txt('มาร่วมทำบุญกันนะคะ สาธุ 🙏',W/2,928,14,'#cbb6f5','center',false);
  ticker.forEach((tk,i)=>{g.globalAlpha=Math.min(1,tk.life);txt(tk.t,40,917+i*19,13,'#fff','left');g.globalAlpha=1});
  if(isDemo||performance.now()<20000){g.fillStyle=status.ok?'#3ddc97':'#ff4d6d';g.beginPath();g.arc(W-20,20,7,0,6.28);g.fill();txt(status.ok?'เชื่อมแล้ว':'รอเชื่อมต่อ',W-32,20,12,'#fff','right')}
}
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)})(last);
</script></body></html>
