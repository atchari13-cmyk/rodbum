<script>const cv=document.getElementById('c'),g=cv.getContext('2d');

const q=new URLSearchParams(location.search);
// ตั้งค่าผ่านลิงก์: ?tts=gift|all|off  ?sfx=0  ?vol=0.5  ?bpm=120 (จังหวะเต้น)  ?music=0.5 (เปิดเพลงในเกม)  ?talk=40  ?ban=คำ,คำ  ?debug

// ================= เสียง =================
let AC=null,master=null,mg=null,audioOn=false;
function startAudio(){
  document.getElementById('start').style.display='none';
  try{const e=document.documentElement;(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(_){}
  try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=P.vol;master.connect(AC.destination);
    mg=AC.createGain();mg.gain.value=P.music*.5;mg.connect(master);
    if('speechSynthesis' in window)speechSynthesis.speak(new SpeechSynthesisUtterance(''));audioOn=true;sfx('chime');startMusic();setTimeout(()=>speak(INVITE[0],{rate:.92,pitch:1.05,long:1}),2500)}catch(e){}
}
function tone(f,t0,d,type,v,dest){
  const o=AC.createOscillator(),gn=AC.createGain(),t=AC.currentTime+t0;
  o.type=type;o.frequency.value=f;gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);
  gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(dest||master);o.start(t);o.stop(t+d+.05);
}
const SFX={
  plop(){tone(300,0,.12,'sine',.12);tone(520,.04,.14,'sine',.08)},
  coin(){tone(1320,0,.12,'square',.05);tone(1760,.08,.3,'square',.05)},
  bell(){[196,392,588,790].forEach((f,i)=>tone(f,0,2.4-i*.4,'sine',.22/(i+1)))},
  gold(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.07,.45,'triangle',.1))},
  chime(){[784,988,1175,1568].forEach((f,i)=>tone(f,i*.13,1,'sine',.1))},
  boom(){tone(90,0,.5,'sawtooth',.12);tone(60,.05,.6,'sine',.2)},
  rattle(){for(let i=0;i<9;i++)tone(700+Math.random()*800,i*.07,.05,'square',.04)},
  stick(){tone(1900,0,.25,'triangle',.08);tone(2500,.05,.2,'triangle',.05)},
  whoosh(){tone(200,0,.5,'sawtooth',.05);tone(900,.05,.4,'triangle',.05)},
  big(){SFX.bell();SFX.gold();setTimeout(SFX.boom,200);setTimeout(SFX.coin,350)}
};
const sfxT={};
function sfx(n){if(!AC||!P.sfx)return;const t=performance.now();if(t-(sfxT[n]||0)<120)return;sfxT[n]=t;try{SFX[n]()}catch(e){}}
// ================= อ่านออกเสียงไทย =================
let lastSpoke=performance.now();let voices=[];const tts={q:[],busy:false,id:0};
if('speechSynthesis' in window){const lv=()=>voices=speechSynthesis.getVoices();lv();speechSynthesis.onvoiceschanged=lv}
function clean(s,m){
  return String(s).replace(/https?:\/\/\S+/g,'').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}\u{200D}]/gu,'')
    .replace(/5{3,}/g,'ฮ่าๆๆ').replace(/(.)\1{3,}/gu,'$1$1').trim().slice(0,m||90);
}
function speak(text,o){
  o=o||{};if(!audioOn||P.tts==='off'||!('speechSynthesis' in window))return;
  text=clean(text,o.long?240:90);if(!text)return;
  if(o.pri){tts.q=tts.q.filter(x=>x.pri);tts.q.push({t:text,pri:1,rate:o.rate,pitch:o.pitch})}
  else{if(tts.q.length>=2)return;tts.q.push({t:text,rate:o.rate,pitch:o.pitch})}
  nextSpeak();
}
function nextSpeak(){
  if(tts.busy||!tts.q.length)return;
  const it=tts.q.shift(),u=new SpeechSynthesisUtterance(it.t),id=++tts.id;
  u.lang='th-TH';const v=voices.find(v=>/^th/i.test(v.lang));if(v)u.voice=v;
  u.rate=it.rate||1;u.pitch=it.pitch||1;u.volume=Math.min(1,P.vol+.2);
  tts.busy=true;lastSpoke=performance.now();duck(1);const done=()=>{if(tts.id===id){tts.busy=false;lastSpoke=performance.now();duck(0);nextSpeak()}};
  u.onend=done;u.onerror=done;speechSynthesis.speak(u);
  setTimeout(()=>{if(tts.busy&&tts.id===id){speechSynthesis.cancel();done()}},15000);
}

const TRACKS=[
 {n:'Neon Night',bpm:124,root:55,bt:'sawtooth',lt:'square',kick:'x...x...x...x...',snare:'....x.......x...',hat:'..x...x...x...x.',ch:[0,0,5,3],

  bass:[0,null,12,null,0,null,12,10,0,null,12,null,7,null,10,12],lead:[null,19,null,19,22,null,19,null,null,17,null,17,19,null,15,null]},
 {n:'ลูกทุ่งแดนซ์',bpm:130,root:73.4,bt:'triangle',lt:'triangle',kick:'x..x..x.x..x..x.',snare:'....x...x...x...',hat:'x.x.x.x.x.x.x.x.',ch:[0,0,5,7],
  bass:[0,null,null,0,null,null,7,null,0,null,null,7,null,5,null,3],lead:[12,14,16,null,19,16,14,null,12,14,16,19,21,19,16,null]},
 {n:'Latin Heat',bpm:100,root:65.4,bt:'sawtooth',lt:'triangle',kick:'x..x..x...x.x...',snare:'....x..x....x...',hat:'x.x.x.xxx.x.x.xx',ch:[0,5,3,7],
  bass:[0,null,null,7,null,null,5,null,0,null,7,null,5,null,3,null],lead:[null,null,15,null,17,15,null,12,null,null,15,null,19,17,null,null]},
 {n:'Retro Wave',bpm:108,root:55,bt:'sawtooth',lt:'square',kick:'x...x...x...x...',snare:'....x.......x..x',hat:'x.x.x.x.x.x.x.xx',ch:[0,0,5,7],
  bass:[0,0,0,0,0,0,0,0,5,5,5,5,3,3,3,3],lead:[12,null,null,15,null,null,17,null,19,null,null,17,null,15,null,null]}
];
const TRK_DUR=100;
let TI=0,tStep=0,tNext=0,tT0=0,tAlign=true,trkStart=performance.now(),noiseBuf=null;
const TR=()=>TRACKS[TI];
function getBeat(){
  if(!P.music)return performance.now()/1000*BPM/60;
  const bpm=TR().bpm;
  if(AC&&!tAlign&&tT0)return Math.max(0,(AC.currentTime-tT0))*bpm/60;
  return performance.now()/1000*bpm/60;
}
function duck(on){if(!AC||!mg)return;try{mg.gain.setTargetAtTime(P.music*.8*(on?.35:1),AC.currentTime,.15)}catch(_){}}
function noise(t,hp,lp,v,d){
  const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();
  if(hp){f.type='highpass';f.frequency.value=hp}else{f.type='bandpass';f.frequency.value=lp;f.Q.value=.8}
  const gn=AC.createGain();gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.001,t+d);
  s.connect(f);f.connect(gn);gn.connect(mg);s.start(t);s.stop(t+d+.02);
}
function kick(t){const o=AC.createOscillator(),gn=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);
  gn.gain.setValueAtTime(1,t);gn.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(gn);gn.connect(mg);o.start(t);o.stop(t+.3)}
function synth(f,t,d,type,v,cut){
  const o=AC.createOscillator(),fl=AC.createBiquadFilter(),gn=AC.createGain();o.type=type;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=cut;fl.Q.value=4;
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(v,t+.01);gn.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(fl);fl.connect(gn);gn.connect(mg);o.start(t);o.stop(t+d+.03);
}
function playStep(T,s,t,spb){
  const b=s%16,bar=Math.floor(s/16),ch=T.ch[bar%4];
  if(T.kick[b]==='x')kick(t);
  if(T.snare[b]==='x')noise(t,0,1800,.4,.16);
  if(T.hat[b]==='x')noise(t,7000,0,b%4===2?.16:.1,b%4===2?.09:.04);
  if(T.bass[b]!=null)synth(T.root*Math.pow(2,(T.bass[b]+ch)/12),t,spb*1.8,T.bt,.32,900);
  if(T.lead[b]!=null&&bar%4>=1)synth(T.root*2*Math.pow(2,(T.lead[b]+ch)/12),t,spb*2.2,T.lt,.1,3200);
}
function sched(){
  if(!AC||!P.music||!noiseBuf)return;
  const T=TR(),spb=60/T.bpm/4;
  while(tNext<AC.currentTime+.14){
    if(tAlign){tT0=tNext;tStep=0;tAlign=false}
    playStep(TR(),tStep,tNext,60/TR().bpm/4);tNext+=60/TR().bpm/4;tStep++;
  }
}
function startMusic(){
  if(!AC||!P.music)return;
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  mg.gain.value=P.music*.8;tNext=AC.currentTime+.15;tAlign=true;trkStart=performance.now();setInterval(sched,30);
}
function nextTrack(){TI=(TI+1)%TRACKS.length;tAlign=true;trkStart=performance.now();flash=1;burstConfetti(60)}

// ================= คำเชิญพูดเป็นระยะๆ ตอนเงียบ =================

 'ขอบคุณทุกคนที่มาเต้นด้วยกันนะคะ ขอให้สนุกและมีความสุขตลอดคืนนี้ค่ะ'
];
let invOrder=[],invN=0;
function nextInvite(){
  invN++;
  const st=[...ppl.values()].filter(p=>p.slot>=0).length,tot=ppl.size;
  if(invN%4===0&&tot>0)return 'ตอนนี้มีคนขึ้นเวทีเต้น '+st+' คน และมีผู้ร่วมงานทั้งหมด '+tot+' คน ขอบคุณที่มาสนุกด้วยกันนะคะ';

// ================= ตัวกรองคำไม่เหมาะสม =================
const norm=s=>String(s).toLowerCase().replace(/[\s.\-_*~'"`|,/\\+=()\[\]{}<>:;\u00b7\u2022\u200b-\u200d\ufeff]/g,'').replace(/(.)\1{2,}/gu,'$1');
const noTone=s=>s.replace(/[\u0E48-\u0E4B]/g,'');
const TH_BAD=['เหีย','สัส','ควย','เย็ด','เชีย','เงียน','ตอแหล','ระยำ','เสือก','กระหรี','ดอกทอง','สนตีน','แตด','ชักวาว','ไอสัตว์','อีสัตว์','ไปตาย','ชาติหมา','ขายตัว'];
const EXTRA=(q.get('ban')||'').split(',').map(w=>noTone(norm(w))).filter(Boolean);
const EN_BAD=/fuck|shit|bitch|asshole|nigg(a|er)|whore|slut|pussy|porn|faggot/;
function isBad(s){
  s=String(s||'');const n=norm(s),th=noTone(n);
  if(/https?:|www\.|\.com|line\.me|@\w{3,}|\d{9,}/i.test(s))return true;
  if(TH_BAD.some(w=>th.includes(w))||EXTRA.some(w=>th.includes(w)))return true;
  if(/หี(?!บ)/.test(th)||/แม่ง|ห่า(?![งน])/.test(n))return true;
  const en=n.replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/@/g,'a').replace(/\$/g,'s');
  return EN_BAD.test(en)||/\b(dick|rape|raped|rapist|cunt)\b/.test(s.toLowerCase());
}

function burst(x,y,c,n,sp,gv){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=sp*(.3+Math.random());parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7+Math.random()*.6,c,g:gv||0})}}
function firework(x,y,c,n){n=n||34;for(let i=0;i<n;i++){const a=i/n*6.283,s=rnd(80,115);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1.2,c,g:45,add:1})}}
const FW=()=>[rnd(70,470),rnd(262,340)];
function skyLantern(x,y){lants.push({x:x||rnd(30,510),y:y||rnd(400,470),sd:rnd(0,6),age:0,sp:rnd(20,30),big:Math.random()<.3})}
function getP(id,name,avatar){
  let p=ppl.get(id);
  if(!p){
    if(ppl.size>=MAXP){let v=null;for(const x of ppl.values())if(!v||x.last<v.last)v=x;ppl.delete(v.id)}
    const h=hash(id);
    p={id,name:(isBad(name||id)?'ผู้ใจบุญ':(name||id)).slice(0,12),male:(h>>3)%3===0,sai:SAI[h%8],sin:SIN[(h>>4)%8],skin:SK[(h>>7)%4],
       x:rnd(30,200)<100?-10:550,y:rnd(CY0,CY1),tx:0,ty:0,wt:0,tasks:[],act:0,pend:0,score:0,glow:0,gold:0,bub:'',bubT:0,
       img:null,walk:0,mv:false,last:0,ns:Math.floor(Math.random()*4),dir:1};
    p.tx=rnd(40,500);p.ty=rnd(CY0,CY1);
    if(avatar){const im=new Image();im.onload=()=>p.img=im;im.src=avatar}
    ppl.set(id,p);
  }
  p.last=performance.now();return p;
}
const task=(s,o)=>Object.assign({s,ox:rnd(-18,18),oy:rnd(-4,8)},o||{});
function addTask(p,t,front){if(front)p.tasks.unshift(t);else if(p.tasks.length<3)p.tasks.push(t)}
function addScore(p,n){p.score+=n;total+=n;if(total>=goal){while(total>=goal)goal+=100;celebrate()}}
function celebrate(){
  sfx('big');banner={t1:'🪷 บุญครบ '+(goal-100)+'!',t2:'ปล่อยโคมลอยเต็มท้องฟ้า',life:5,tier:3};
  for(let i=0;i<16;i++)setTimeout(()=>skyLantern(),i*160);
  for(let i=0;i<6;i++)setTimeout(()=>{const f=FW();firework(f[0],f[1],SAI[i%8],38);sfx('boom')},i*380);

// ================= อัปเดต =================
function update(dt){
  if(P.music&&performance.now()-trkStart>TRK_DUR*1000)nextTrack();
  groupT=Math.max(0,groupT-dt);flash=Math.max(0,flash-dt);
  const list=[...ppl.values()];
  const dancing=p=>p.dance>0||groupT>0||(p.fx&&p.fx.tier===3&&p.fx.t>0);
  const occ=new Array(12).fill(null);
  for(const p of list){
    p.dance-=dt;p.spot-=dt;p.glow-=dt;p.bubT-=dt;if(p.fx&&(p.fx.t-=dt)<=0)p.fx=null;
    if(p.slot>=0){if(dancing(p))occ[p.slot]=p;else p.slot=-1}
  }
  for(const p of list)if(p.fx&&p.fx.tier===3&&dancing(p)&&p.slot!==11&&!occ[11]){if(p.slot>=0)occ[p.slot]=null;p.slot=11;occ[11]=p}
  const want=list.filter(p=>dancing(p)&&p.slot<0).sort((a,b)=>b.score-a.score);
  for(const p of want){const i=occ.findIndex((o,k)=>!o&&k<11);if(i<0)break;occ[i]=p;p.slot=i}
  for(const p of list){
    const T=p.slot>=0?SLOTS[p.slot]:HOMES[p.home],k=Math.min(1,dt*(p.slot>=0?5:4));
    p.x+=(T.x-p.x)*k;p.y+=(T.y-p.y)*k;p.s+=(T.s-p.s)*k;
    if(p.fx&&Math.random()<dt*9&&parts.length<400){const A=AURA[p.fx.aura];parts.push({x:p.x+rnd(-16,16),y:p.y-rnd(8,70)*p.s,vx:rnd(-10,10),vy:-rnd(18,40),l:1.2,c:A.c,ch:A.ch,g:0})}
  }
  for(const f of floats){f.l-=dt;f.y-=24*dt}floats=floats.filter(f=>f.l>0);
  parts=parts.filter(p=>(p.l-=dt)>0);for(const p of parts){p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.99}
  if(banner&&(banner.life-=dt)<=0)banner=null;
}

  if(dn){g.strokeStyle=hsl(t*70+p.off*300,95,65,.9);g.lineWidth=3.4;g.beginPath();g.arc(0,hy,hr+2,0,6.28);g.stroke()}
  g.fillStyle=p.skin;g.beginPath();g.arc(0,hy,hr,0,6.28);g.fill();
  if(p.img){g.save();g.beginPath();g.arc(0,hy,hr,0,6.28);g.clip();try{g.drawImage(p.img,-hr,hy-hr,2*hr,2*hr)}catch(e){}g.restore()}
  else{g.fillStyle='#1e1410';g.beginPath();g.arc(0,hy-1,hr+.5,3.3,6.1);g.fill();g.fillStyle='#2a1a14';g.beginPath();g.arc(-4,hy+1,1.3,0,6.28);g.arc(4,hy+1,1.3,0,6.28);g.fill();g.strokeStyle='#8a3a3a';g.lineWidth=1.2;g.beginPath();g.arc(0,hy+3,3.5,.2,2.9);g.stroke()}
  g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(0,hy,hr,0,6.28);g.stroke();
  if(p.acc===0){g.strokeStyle=p.c2;g.lineWidth=3;g.beginPath();g.arc(0,hy,hr+1,3.35,6.07);g.stroke()}
  else if(p.acc===1){g.fillStyle=p.c2;g.beginPath();g.moveTo(8,hy-hr+2);g.lineTo(16,hy-hr-4);g.lineTo(16,hy-hr+8);g.closePath();g.fill();g.beginPath();g.moveTo(8,hy-hr+2);g.lineTo(0,hy-hr-4);g.lineTo(0,hy-hr+8);g.closePath();g.fill()}
  else{g.fillStyle=p.c2;g.beginPath();g.arc(0,hy-hr+3,hr-1,3.3,6.12);g.fill();g.fillRect(-2,hy-hr+1,14,3)}
  if(tier===3){g.fillStyle='#ffd23f';g.beginPath();g.moveTo(-9,hy-hr);g.lineTo(-8,hy-hr-11);g.lineTo(-3,hy-hr-4);g.lineTo(0,hy-hr-13);g.lineTo(3,hy-hr-4);g.lineTo(8,hy-hr-11);g.lineTo(9,hy-hr);g.closePath();g.fill()}
  g.restore();g.restore();g.lineCap='butt';
  txt(p.name,p.x,p.y+10*S+(S>1?2:0),11,'#fff');
  if(p.bubT>0&&p.bub){
    g.font='bold 13px '+FONT;const w=g.measureText(p.bub).width+18,by=p.y-70*S-14,cx=Math.max(w/2+4,Math.min(W-w/2-4,p.x));
    g.globalAlpha=Math.min(1,p.bubT);g.fillStyle='#fff';rr(cx-w/2,by-12,w,24,12);g.fill();txt(p.bub,cx,by,13,'#2a0f4d','center',false);g.globalAlpha=1;
  }
}

  const GB=[['🌹 เล็ก','สปอตไลต์ส่องตัว','ออร่าตามของขวัญ'],['🍩 กลาง','ปีกเรืองแสง+ชุดแวว','+ ของเล็กทั้งหมด'],['🌌 ใหญ่','มงกุฎ+เวทีกลาง','เต้นเดี่ยวโชว์ทั้งงาน']];

    txt(r[0],bx+82,154,15,'#ffe9a8');txt(r[1],bx+82,172,13,'#fff',null,false);txt(r[2],bx+82,188,12,'#cbb6f5',null,false)});
